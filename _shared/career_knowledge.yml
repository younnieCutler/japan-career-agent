  scope:
  - mock-interviewer
  - tenshoku-strategy
  supporting_claim_ids:
  - hataractive_career_gap_2024
  counterevidence:
  - Hiring respondents vary in whether and when a gap matters; the survey does not establish a universal
    penalty.
