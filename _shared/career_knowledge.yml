- id: salary_anchor_not_rule
  status: active
  topics:
  - salary-anchoring
  scope:
  - tenshoku-strategy
  supporting_claim_ids:
  - doda_salary_basis_guidance_2026
  counterevidence:
  - The guidance describes common compensation inputs and does not establish a universal negotiation formula
    or market value.
  allowed_behavior:
  - Surface current compensation as a possible anchor and compare it with stated range or grade, role
    scope, confirmed contribution, competing offers, and user priorities.
  forbidden_behavior:
  - Do not use current compensation plus 10 percent, or any fixed uplift, as a Japan default.
  reviewed_at: '2026-09-11'
  expires_on: '2027-03-11'
  required_scenarios:
  - salary-anchor
  - salary-plus10
  lifecycle_revision: 1
