- id: career_values_legitimate
  status: active
  topics:
  - career-values
  - turnover-reason
  scope:
  - tenshoku-strategy
  supporting_claim_ids:
  - doda_turnover_reasons_2026
  counterevidence:
  - Survey prevalence does not make any reason the right interview answer for a particular candidate.
  allowed_behavior:
  - Treat compensation, working conditions, evaluation, role scope, location, learning, mission, and other
    user-confirmed conditions as independent career values.
  forbidden_behavior:
  - Do not rank salary or benefits as inferior motives or replace the candidate actual reason with a more
    socially desirable one.
