- id: short_tenure_context
  status: active
  topics:
  - short-tenure
  scope:
  - mock-interviewer
  - tenshoku-strategy
  supporting_claim_ids:
  - mynavi_early_turnover_2024
  counterevidence:
  - The 9.5-month survey average is not a universal threshold; repeated transitions or longer tenures
    may still be questioned depending on context.
  allowed_behavior:
  - Separate documented tenure length, transition pattern, factual reason, and period evidence; use short
    tenure to generate verification questions, not a verdict.
  forbidden_behavior:
  - Do not require three years, apply a fixed short-tenure penalty, or infer retention failure from one
    short tenure.
  reviewed_at: '2026-09-11'
  expires_on: '2027-03-11'
  required_scenarios:
