- id: evidence_safe_story_lens
  status: active
  topics:
  - experience-elicitation
  - 3c4p
  scope:
  - career-tanaoroshi
  supporting_claim_ids:
  - doda_self_pr_structure_2026
  counterevidence:
  - The source supports a situation-intent-action-result structure; it does not validate 3C4P labels or
    superiority over STAR.
  allowed_behavior:
  - Use 3C4P only as an optional internal question lens and map answers back to canonical evidence, preserving
    individual contribution, team result, provenance, and actual measurement.
  forbidden_behavior:
  - Do not present 3C4P as a Japanese hiring standard, force every experience into it, or create an approximate
    KPI when none was measured.
  reviewed_at: '2026-09-11'
