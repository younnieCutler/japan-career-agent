tasks:
  - id: withholding_slip
    label_ja: 給与所得の源泉徴収票
    category: tax
    phase: post_resignation
    owner: former_employer
    user_action: receive
    requiredness: required
    required_inputs: [employment_end_date]
    trigger_field: employment_end_date
    deadline:
      kind: months_after
      value: 1
    source_ids: [nta_withholding_slip]
    guidance: 年の中途で退職した受給者には退職日以後1か月以内に交付される。新勤務先の年末調整等で使用するため保管する。

  - id: employment_insurance_number
    label_ja: 雇用保険被保険者証・被保険者番号
    category: employment_insurance
    phase: before_new_employment
    owner: user
    user_action: confirm_identifier
    requiredness: required
    required_inputs: [new_employment_insurance_enrollment]
    applies_if:
      all:
        - field: new_employment_insurance_enrollment
          op: eq
          value: true
    source_ids: [hello_work_insurance_number, mhlw_employment_insurance_scope]
    guidance: 新勤務先で雇用保険の被保険者になることが確認できた場合に既存の被保険者番号を確認する。入社日だけで加入対象と推測しない。

  - id: retirement_certificate
    label_ja: 退職証明書
    category: employment
    phase: post_resignation
    owner: former_employer
    user_action: request_if_needed
    requiredness: recommended
    required_inputs: [employment_end_date]
    source_ids: [mhlw_retirement_certificate]
    guidance: 労働者が請求した場合、使用者は遅滞なく交付する。全員への自動交付を前提にしない。

  - id: resident_tax_special_collection_handoff
    label_ja: 個人住民税の特別徴収継続
    category: resident_tax
    phase: employer_handoff
    owner: former_and_new_employer
    user_action: confirm_processing
    requiredness: required
    required_inputs: [resident_tax_mode]
    applies_if:
      all:
        - field: resident_tax_mode
          op: eq
          value: continue_special_collection
    source_ids: [resident_tax_continuation]
    municipality_specific: true
    guidance: 給与所得者異動届出書は旧勤務先と新勤務先が引き継いで自治体へ提出する流れ。利用者が普遍的に受領・提出する書類として扱わない。提出期限・様式は自治体の現行案内を確認する。

  - id: separation_slip
    label_ja: 雇用保険被保険者離職票-1・2
    category: employment_insurance
    phase: post_resignation
    owner: former_employer
    user_action: receive_if_claiming_benefit
    requiredness: conditional
    required_inputs: [unemployment_benefit_planned]
    applies_if:
      all:
        - field: unemployment_benefit_planned
          op: eq
          value: true
    source_ids: [hello_work_separation_slip]
    guidance: 失業等給付の受給資格決定では離職票を提出する。直ちに再就職し受給を予定しない場合の普遍的must-haveにはしない。

  - id: health_insurance_loss_proof
    label_ja: 健康保険資格喪失証明等
    category: health_insurance
    phase: insurance_transition
    owner: user
    user_action: obtain_if_needed
    requiredness: conditional
    required_inputs: [health_insurance_after_exit]
    applies_if:
      all:
        - field: health_insurance_after_exit
          op: eq
          value: national_health_insurance
    source_ids: [pension_health_loss_proof]
    guidance: 国民健康保険加入など資格喪失日の証明が必要な場面で取得する。翌日から新勤務先の健康保険に加入するケースへ一律必須としない。

  - id: pension_identifier
    label_ja: マイナンバー又は基礎年金番号の確認資料
    category: pension
    phase: before_new_employment
    owner: user
    user_action: confirm_identifier
    requiredness: required
    required_inputs: [new_social_insurance_enrollment]
    applies_if:
      all:
        - field: new_social_insurance_enrollment
          op: eq
          value: true
    source_ids: [pension_identifier]
    guidance: 新勤務先が厚生年金保険の適用を受け、加入予定であることが確認できた場合にマイナンバー又は基礎年金番号の確認資料を提出する。入社日だけで加入対象と推測しない。

  - id: immigration_contract_end_notification
    label_ja: 所属（契約）機関に関する届出・契約終了
    category: immigration
    phase: post_resignation
    owner: user
    user_action: notify_immigration
    requiredness: required
    required_inputs: [residence_status, employment_end_date]
    residence_status_group: contract_institution
    applies_if:
      all:
        - field: residence_status
          op: in_group
          value: contract_institution
    trigger_field: employment_end_date
    deadline:
      kind: days_after
      value: 14
    source_ids: [isa_affiliation_notification, isa_contract_institution]
    guidance: 対象在留資格では契約終了の事由発生日から14日以内に本人が届出する。会社側の別手続と混同しない。

  - id: immigration_new_contract_notification
    label_ja: 所属（契約）機関に関する届出・新たな契約
    category: immigration
    phase: new_employment
    owner: user
    user_action: notify_immigration
    requiredness: required
    required_inputs: [residence_status, new_contract_conclusion_date]
    residence_status_group: contract_institution
    applies_if:
      all:
        - field: residence_status
          op: in_group
          value: contract_institution
    trigger_field: new_contract_conclusion_date
    deadline:
      kind: days_after
      value: 14
    source_ids: [isa_affiliation_notification, isa_contract_institution]
    guidance: 契約機関グループでは新たな契約締結を別イベントとして扱う。入社日を契約締結日と推測しない。

  - id: immigration_activity_leave_notification
    label_ja: 所属（活動）機関に関する届出・離脱
    category: immigration
    phase: post_resignation
    owner: user
    user_action: notify_immigration
    requiredness: required
    required_inputs: [residence_status, employment_end_date]
    residence_status_group: activity_institution
    applies_if:
      all:
        - field: residence_status
          op: in_group
          value: activity_institution
    trigger_field: employment_end_date
    deadline:
      kind: days_after
      value: 14
    source_ids: [isa_affiliation_notification]
    guidance: 活動機関グループでは離脱事由の発生日から14日以内に本人が届出する。

  - id: immigration_activity_transfer_notification
    label_ja: 所属（活動）機関に関する届出・移籍
    category: immigration
    phase: new_employment
    owner: user
    user_action: notify_immigration
    requiredness: required
    required_inputs: [residence_status, new_employment_start_date]
    residence_status_group: activity_institution
    applies_if:
      all:
        - field: residence_status
          op: in_group
          value: activity_institution
    trigger_field: new_employment_start_date
    deadline:
      kind: days_after
      value: 14
    source_ids: [isa_affiliation_notification]
    guidance: 活動機関グループでは新しい活動機関への移籍日を基準に扱う。

  - id: immigration_status_specific_transition_verification
    label_ja: 在留資格固有の転職手続確認
    category: immigration
    phase: before_transition
    owner: user
    user_action: verify_with_immigration
    requiredness: required
    required_inputs: [residence_status]
    applies_if:
      all:
        - field: residence_status
          op: in_group
          value: status_specific_review
    source_ids: [isa_affiliation_notification, isa_contract_institution, isa_highly_skilled_job_change]
    guidance: 高度専門職は指定機関変更に伴う在留資格変更が必要となる場合があり、興行は契約機関届出の対象が契約に基づく活動に限定される。V1では一般ルールを自動適用せず、在留資格固有の現行手続を確認する。

  - id: immigration_additional_transition_verification
    label_ja: 在留資格固有の追加転職手続確認
    category: immigration
    phase: before_transition
    owner: user
    user_action: verify_with_immigration
    requiredness: required
    required_inputs: [residence_status]
    applies_if:
      all:
        - field: residence_status
          op: in_group
          value: additional_transition_review
    source_ids: [isa_affiliation_notification, isa_specified_skilled_worker, isa_status_list]
    guidance: 特定技能は所属機関変更時に在留資格変更許可申請が必要と案内されている。技能実習と企業内転勤も活動・所属先に固有の前提があるため、14日以内の所属機関届出だけで転職手続が完了すると扱わず、在留資格固有の現行手続を別途確認する。

  - id: immigration_unmapped_status_verification
    label_ja: 在留資格別の転職手続確認
    category: immigration
    phase: before_transition
    owner: user
    user_action: verify_with_immigration
    requiredness: required
    required_inputs: [residence_status]
    applies_if:
      all:
        - field: residence_status
          op: not_in_groups
          value:
            - contract_institution
            - activity_institution
            - status_specific_review
            - additional_transition_review
            - unrestricted_work_status
    source_ids: [isa_affiliation_notification, isa_status_change]
    guidance: V1の自動判定対象外の在留資格。就労可否・所属機関届出・在留資格変更の要否を個別に確認し、対象外と推測しない。

  - id: work_qualification_certificate
    label_ja: 就労資格証明書
    category: immigration
    phase: before_or_after_job_change
    owner: user
    user_action: consider_application
    requiredness: recommended
    required_inputs: [residence_status]
    applies_if:
      all:
        - field: residence_status
          op: in_group
          value: contract_institution
    source_ids: [isa_work_qualification]
    guidance: 転職時の一律必須書類ではない。新勤務先・活動内容で現在の就労資格が認められるか公式に確認したい場合の選択肢として扱う。

  - id: residence_status_change_verification
    label_ja: 在留資格変更の要否確認
    category: immigration
    phase: before_new_activity
    owner: user
    user_action: verify_with_immigration
    requiredness: required
    required_inputs: [residence_status, new_activity_scope]
    applies_if:
      all:
        - any:
            - field: residence_status
              op: in_group
              value: contract_institution
            - field: residence_status
              op: in_group
              value: activity_institution
        - field: new_activity_scope
          op: eq
          value: changed
    source_ids: [isa_status_change]
    guidance: 新しい業務が現在の在留資格で認められた活動と異なる可能性がある場合、就労資格証明書だけで済むと断定せず在留資格変更許可申請の要否を確認する。
