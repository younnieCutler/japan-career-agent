residence_status_groups:
  contract_institution:
    - 研究
    - 技術・人文知識・国際業務
    - 介護
    - 技能
    - 特定技能
  activity_institution:
    - 教授
    - 経営・管理
    - 法律・会計業務
    - 医療
    - 教育
    - 企業内転勤
    - 技能実習
    - 留学
    - 研修
  status_specific_review:
    - 高度専門職１号イ
    - 高度専門職１号ロ
    - 高度専門職１号ハ
    - 高度専門職２号イ
    - 高度専門職２号ロ
    - 高度専門職２号ハ
    - 興行
  additional_transition_review:
    - 特定技能
    - 技能実習
    - 企業内転勤
  unrestricted_work_status:
    - 永住者
    - 日本人の配偶者等
    - 永住者の配偶者等
    - 定住者

