# Japan Recruit AI Agent — Shared Schema Contract
# Single source of truth for inter-skill YAML data formats.
#
# When modifying a schema here, update all skills that produce or consume it:
#   SELF_ANALYSIS_PROFILE: jiko-bunseki (producer), job-seeker-agent (consumer)
#   CANDIDATE_PROFILE: job-seeker-agent (producer), matching-simulator / company-battlecard / tenshoku-strategy (consumers)
#   COMPANY_PROFILE:   hiring-manager-agent / kigyou-bunseki (producers), matching-simulator / company-battlecard (consumers)
#   MATCH_HISTORY:     matching-simulator (producer)
#   PIPELINE:          kigyou-bunseki / matching-simulator / tenshoku-strategy / company-battlecard (writers),
#                      CLAUDE.md onboarding + tenshoku-strategy STEP 6 (readers)

schema_version: "1.3"

# ─────────────────────────────────────────────
# SELF_ANALYSIS_PROFILE
# Produced by: jiko-bunseki (Phase 2; Phase 3 fields stay null until the depth-dive runs)
# Consumed by: job-seeker-agent (reuses values/preferences; still owns SPI3 + scoring)
# Pipeline position: runs BEFORE job-seeker-agent for direction-setting.
# ─────────────────────────────────────────────
self_analysis_profile:
  required:
    - candidate_name       # string
    - language_preference  # string: "ko" | "ja"
    - track                # string: "shinsotsu" | "chuto"
    - top_strengths        # list of objects: see top_strength_schema
    - strength_clusters    # object: see strength_cluster_schema
    - work_style           # object: see self_work_style_schema
    - wellbeing_priorities # object: same structure as wellbeing_schema (1–5)

  optional:
    - preferred_company_type     # string: "SIer" | "self-developed startup" | "large enterprise" | null
    - preferred_role_environment # list of strings (e.g., "high-autonomy", "fast-feedback")
    - recommended_role_clusters  # list of strings
    - risk_flags                 # list of strings (evidence-based only; omit if none)
    - self_pr_seeds              # list of strings: reusable in self-PR / interview
    # --- Phase 3 depth layer (null until Phase 3 runs) ---
    - career_anchors    # object: { primary: string, secondary: list, will_not_give_up: string } | null
    - derailers         # list of objects: { strength, overuse_risk, watch_signal } | null
    - energy_map        # object: { energizes: list, drains: list, misfit_flag: string|null } | null
    - career_theme      # string: one line connecting past to future | null

top_strength_schema:
  - name:    "string: strength id (e.g., 'ownership', 'analysis')"
    score:   "integer 0–16"
    cluster: "string: executing | strategic_thinking | relationship_building | influencing"

strength_cluster_schema:
  # All values: integer 0–100 (normalized)
  executing:              ~
  strategic_thinking:     ~
  relationship_building:  ~
  influencing:            ~

self_work_style_schema:
  # All values: integer 1–5
  autonomy:                 ~
  structure_preference:     ~
  speed_preference:         ~
  change_tolerance:         ~
  collaboration_preference: ~
  feedback_frequency:       ~

# ─────────────────────────────────────────────
# CANDIDATE_PROFILE
# Produced by: job-seeker-agent (STEP 4)
# Consumed by: matching-simulator, company-battlecard, tenshoku-strategy
# ─────────────────────────────────────────────
candidate_profile:
  required:
    - candidate_name      # string: "박민준"
    - spi3                # object: see spi3_schema
    - portable_skills     # object: see portable_skills_schema
    - target_role         # string: "Data Engineer"
    - jlpt_level          # string: "N1" | "N2" | "N3" | "N4" | "None" | null

  optional:
    - skill_stack         # list of objects: see skill_stack_schema
    - wellbeing_priorities  # object: see wellbeing_schema
    - target_company_type   # string: "self-developed" | "SIer" | "SES" | "consulting" | "startup" | "large enterprise" | null
    - visa_status           # string: "PR" | "Engineer/Specialist" | "Student" | null
    - track                 # string: "shinsotsu" | "chuto"

spi3_schema:
  creation: "float 0–10 | null"
  result:   "float 0–10 | null"
  harmony:  "float 0–10 | null"
  order:    "float 0–10 | null"
  primary_trait: "string: highest-scoring quadrant name | null"

portable_skills_schema:
  # All values: integer 1–5 | null
  analytical_thinking: ~
  planning:            ~
  drive:               ~
  innovation:          ~   # maps to "Reform Mindset (変革力)"
  agility:             ~
  negotiation:         ~
  coaching:            ~
  emotional_regulation: ~

skill_stack_schema:
  # List of objects with these fields:
  - name:       "string: skill name"
    level:      "string: basic | intermediate | advanced | expert"
    capability: "string: mapped capability from ontology (e.g., 'data analysis')"

wellbeing_schema:
  # All values: integer 1–5 | null
  # 1 = not important at all / 5 = essential
  autonomy:             ~   # 自己決定感
  social_contribution:  ~   # 社会貢献感
  management_quality:   ~   # 上司のマネジメント
  mutual_respect:       ~   # 組織内の相互尊重

# ─────────────────────────────────────────────
# COMPANY_PROFILE
# Produced by: hiring-manager-agent, kigyou-bunseki
# Consumed by: matching-simulator, company-battlecard
# ─────────────────────────────────────────────
company_profile:
  required:
    - company_name        # string
    - position            # string: job title
    - required_skills     # list of strings

  optional:
    - industry            # string
    - headcount           # integer | null
    - company_type        # string: "self-developed" | "SIer" | "SES" | "consulting" | "startup" | "large enterprise"
    - chuto_saiyo_ratio   # number 0–100 | null: mid-career hire ratio (中途採用比率), from kigyou-bunseki when available
    - hyperformer_spi3    # object: same structure as spi3_schema
    - hyperformer_portable_skills  # object: same structure as portable_skills_schema
    - accepted_adjacent_skills     # list of strings
    - wellbeing_scores             # object: same structure as wellbeing_schema
    - salary_range        # object: { min: integer, max: integer, currency: "JPY" }
    - remote_policy       # string: "full-remote" | "hybrid" | "on-site"
    - visa_sponsorship    # boolean | null

# ─────────────────────────────────────────────
# MATCH_HISTORY
# Appended to: data/match_history.md
# Produced by: matching-simulator (STEP 4)
# ─────────────────────────────────────────────
match_history_entry:
  - date                  # string: "YYYY-MM-DD"
  - candidate_name        # string
  - company_name          # string
  - position_title        # string
  - recruit_style_score   # integer 0–100 (approximate, ±10)
  - persol_style_score    # integer 0–100 (approximate, ±10)
  - culture_fit_score     # integer 0–100 (approximate, ±10)
  - overall_score         # integer 0–100 (approximate, ±10)
  - overall_grade         # string: "A" | "B" | "C" | "D"
  - platform              # string: platform simulated (e.g., "Recruit / Levtech")
  - report_file           # string: path to markdown report if saved (e.g., "career-docs/match-xyz.md")

# ─────────────────────────────────────────────
# PIPELINE
# File: data/pipeline.yml (CWD-relative, per Output Contract / Rule C)
# The per-company job-search state hub. One entry per company, keyed by slug.
# Written by: kigyou-bunseki (entry + kyujin_legitimacy), matching-simulator (match_score),
#             tenshoku-strategy STEP 6 / 3 / 3-2 (stage transitions, history, deadlines),
#             company-battlecard (history event)
# Read by:    CLAUDE.md onboarding (session-resume kanban), tenshoku-strategy STEP 6
#             (funnel / pattern analysis; renders career-docs/applications.md as a view)
#
# Upsert rules (all writers): read the whole file → modify → rewrite. Match entries by `slug`.
# Never delete an entry — closed entries feed funnel analysis. Set `closed: true` instead.
# Every write follows Rule C: create data/ in the invocation directory if missing, then print
# the absolute path and verify the file exists.
# ─────────────────────────────────────────────
pipeline:
  updated: "string: YYYY-MM-DD — date of last write"
  companies:
    - slug:          "string: same slug as data/company_profiles/{slug}.yml — the join key"
      name:          "string: display name"
      stage:         "integer 0–7: CLAUDE.md Japan 転職 Market Stage Map"
      status:        "string: free-text detail (e.g., '一次面接 scheduled 2026-07-10')"
      channel:       "string: site | agent | scout | referral | null"
      match_score:   "integer 0–100 (latest from matching-simulator, ±10) | null"
      kyujin_legitimacy: "string: green (信頼度高) | yellow (要注意) | red (要確認) — kigyou-bunseki 求人の真正性 tiers | null"
      next_action:   "string | null"
      deadline:      "string YYYY-MM-DD: nearest date — 面接日, 回答期限, … | null"
      closed:        "boolean: true on 内定承諾 / 内定辞退 / お見送り / 自ら見送り"
      closed_reason: "string | null"
      history:       # append-only event log — funnel analysis source
        - { date: "YYYY-MM-DD", event: "string (e.g., '応募 via doda', '書類通過')" }
