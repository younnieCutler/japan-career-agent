# Japan Career Agent — Shared Schema Contract
# Single source of truth for inter-skill YAML data formats.
#
# When modifying a schema here, update all skills that produce or consume it:
#   SELF_ANALYSIS_PROFILE: jiko-bunseki (producer), job-seeker-agent (consumer)
#   CANDIDATE_PROFILE: job-seeker-agent (producer), matching-simulator / company-battlecard / tenshoku-strategy (consumers)
#   COMPANY_PROFILE:   hiring-manager-agent / kigyou-bunseki (producers), matching-simulator / company-battlecard (consumers)
#   MATCH_HISTORY:     matching-simulator (producer)
#   PIPELINE:          kigyou-bunseki / matching-simulator / tenshoku-strategy / company-battlecard (writers),
#                      CLAUDE.md onboarding + tenshoku-strategy STEP 6 (readers),
#                      scripts/status_bar.py + career-agent (readers — status bar, calibrate, rules)
#   RULES:             career-agent (writer, on user approval), scripts/status_bar.py (reader)

schema_version: "2.5"

# Executable contract catalog. The descriptive sections below remain the human-facing source of
# field meaning and legacy policy; these Draft 2020-12 definitions provide a machine-checkable
# shape at every serialization boundary without changing the existing YAML contract.
#
# Three validators are built from this one catalog (_shared/schema_contract.py):
#
#   validate_document      the tolerant READ path. Unknown properties are accepted, because a
#                          record written by an older version of this suite must stay readable.
#   validate_new_write     the strict WRITE path for a whole document.
#   validate_new_fragment  the strict WRITE path for the part of a document a write is adding.
#                          This is what `pipeline_store` uses: an entry already on disk may hold
#                          keys from an older version, and rejecting those would make an existing
#                          pipeline unwritable rather than upgradeable, so only what the write
#                          introduces is checked.
#
# WHAT IS STRICT, EXACTLY. An object is closed when this catalog declares its `properties`, and not
# otherwise. Declaring a shape is what makes it enforceable, so:
#
#   - `work_style_reflection`, `conditions`, `portable_skill_allocation`, `career_self_efficacy`,
#     `requirements`, `mhlw_mapping` and the other bare `{type: object}` / `{type: [object, 'null']}`
#     fields are deliberately opaque HERE. They are not unvalidated: `matching_v3.validate_allocation`
#     and `_shared/self_analysis_profile.py` own their rules. They are validated by the code that
#     knows them rather than by a shape this file never stated.
#   - Write a field's `properties` down and it becomes strict automatically, at any depth.
#
# `scripts/test_schema_contract.py` pins the exact list of closed objects, so a field joining or
# leaving that set is a visible diff rather than a quiet change to what a write may contain.
#
# Because the read and write paths share one property list, every field a writer may legitimately
# produce has to be named here. Fields promoted from the prose sections below carry NO type
# constraint on purpose: adding a type would newly reject historical records that hold a different
# shape. The schema's job is to stop shape drift; value rules stay in the Python validators that
# already own them (`_shared/pipeline_store.py`, `_shared/self_analysis_profile.py`,
# `skills/career-agent/validation.py`).
$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://github.com/younnieCutler/japan-career-agent/shared-schemas"
$defs:
  SELF_ANALYSIS_PROFILE:
    type: object
    required:
      - self_analysis_version
      - candidate_name
      - language_preference
      - track
      - interest_hypotheses
      - behavior_tendencies
      - evidence_episodes
      - career_self_efficacy
      - perceived_barriers
      - perceived_supports
      - environment_preferences
      - value_candidates
      - avoid_candidates
    properties:
      self_analysis_version: {type: integer, const: 2}
      candidate_name: {type: string, minLength: 1}
      language_preference: {enum: [ko, ja, en]}
      track: {enum: [shinsotsu, chuto]}
      interest_hypotheses: {type: [array, 'null']}
      behavior_tendencies: {type: [array, 'null']}
      evidence_episodes: {type: [array, 'null']}
      career_self_efficacy: {type: [object, 'null']}
      perceived_barriers: {type: [array, 'null']}
      perceived_supports: {type: [array, 'null']}
      environment_preferences: {type: [object, 'null']}
      value_candidates: {type: [array, 'null']}
      avoid_candidates: {type: [array, 'null']}
      career_context_confirmed: {type: boolean}
      # Promoted from the descriptive `self_analysis_profile` block below.
      preferred_environment_hypothesis: {}
      verification_questions: {}
      recommended_role_clusters: {}
      self_pr_seeds: {}
      career_anchors: {}
      derailers: {}
      energy_map: {}
      career_theme: {}
      career_values: {}
      notes: {}
      # legacy_v1, readable forever and never written by a v2 producer. Naming them keeps a legacy
      # profile readable while `validate_new_write` still refuses to create one.
      top_strengths: {}
      strength_clusters: {}
      work_style: {}
      wellbeing_priorities: {}
      preferred_role_environment: {}
      risk_flags: {}
      preferred_company_type: {}
    additionalProperties: true

  CANDIDATE_PROFILE:
    type: object
    required: [candidate_name, work_style_reflection, skill_stack, target_role, jlpt_level]
    properties:
      candidate_name: {type: string, minLength: 1}
      work_style_reflection: {type: object}
      skill_stack: {type: array}
      target_role: {type: string, minLength: 1}
      jlpt_level: {type: [string, 'null']}
      track: {enum: [shinsotsu, chuto, null]}
      portable_skill_level: {type: [integer, 'null'], minimum: 1, maximum: 5}
      portable_skill_allocation: {type: [object, 'null']}
      career_values: {type: [object, 'null']}
      # Promoted from the descriptive `candidate_profile` block below.
      portable_skill_assessed_at: {}
      wellbeing_priorities: {}
      segment: {}
      visa_status: {}
      # legacy_v1 / read-only compatibility aliases.
      spi3: {}
      portable_skills: {}
      target_company_type: {}
    additionalProperties: true

  COMPANY_PROFILE:
    type: object
    required: [company_name, position, required_skills]
    properties:
      company_name: {type: string, minLength: 1}
      position: {type: string, minLength: 1}
      required_skills: {type: array, items: {type: string}}
      requirements: {type: [object, 'null']}
      conditions: {type: [object, 'null']}
      mhlw_mapping: {type: [object, 'null']}
      visa_sponsorship: {type: [boolean, 'null']}
      # Promoted from the descriptive `company_profile` block below.
      industry: {}
      headcount: {}
      company_type: {}
      chuto_saiyo_ratio: {}
      accepted_adjacent_skills: {}
      salary_range: {}
      remote_policy: {}
      # legacy_v1 inputs, readable and never written by a v3 producer.
      top_performer_spi3: {}
      top_performer_portable_skills: {}
      wellbeing_scores: {}
    additionalProperties: true

  MATCH_HISTORY:
    type: array
    items:
      type: object
      required: [date, model_version, candidate_name, company_name, position_title]
      properties:
        date: {type: string, minLength: 1}
        model_version: {enum: [evidence_based_v3, legacy_v1]}
        candidate_name: {type: string, minLength: 1}
        company_name: {type: string, minLength: 1}
        position_title: {type: string, minLength: 1}
        decision_status: {enum: [proceed, review, conflict, null]}
        # Promoted from the descriptive `match_history_entry` block below.
        platform: {}
        report_file: {}
        required_coverage: {}
        required_coverage_status: {}
        portable_skill_status: {}
        portable_skill_distance: {}
        portable_skill_rank: {}
        compared_profiles: {}
        conflicts: {}
        missing_information: {}
        # legacy_v1 history. Present on entries written before evidence_based_v3, never on new ones.
        screening_probability: {}
        platform_probability: {}
        recruit_style_score: {}
        persol_style_score: {}
        culture_fit_score: {}
        overall_score: {}
        overall_grade: {}
      additionalProperties: true

  PIPELINE:
    type: object
    required: [companies]
    properties:
      updated: {type: [string, 'null']}
      companies:
        type: array
        items:
          type: object
          required: [slug, name]
          properties:
            slug: {type: string, minLength: 1}
            name: {type: string, minLength: 1}
            stage: {type: [integer, 'null'], minimum: 0, maximum: 7}
            closed: {type: [boolean, 'null']}
            decision_status: {enum: [proceed, review, conflict, null]}
            # Which confirmed work events this JD selects, and which of its requirements nothing
            # supports. Per company because the answer differs per JD: the same person leads with
            # incident response at one employer and stakeholder coordination at another. The user's
            # own axes -- employment_status, job_search, career_mode -- are never copied here.
            primary_project_ids: {type: array, items: {type: string, minLength: 1}}
            primary_experience_ids: {type: array, items: {type: string, minLength: 1}}
            supporting_experience_ids: {type: array, items: {type: string, minLength: 1}}
            unknown_requirements: {type: array, items: {type: string, minLength: 1}}
            # The JD itself, normalized (schema_version 2.5). `jd_digest` is what makes a generated
            # document reproducible: it says which posting text a projection was built from, so a
            # silently edited JD shows up as a changed digest instead of as an unexplained diff.
            jd_source: {type: [string, 'null']}
            jd_observed_at: {type: [string, 'null']}
            jd_digest: {type: [string, 'null']}
            jd_requirements:
              type: array
              items:
                type: object
                required: [text]
                properties:
                  text: {type: string, minLength: 1}
                  kind: {enum: [required, preferred, null]}
                  status: {enum: [Matched, Missing, Unknown, null]}
                  evidence_ids: {type: array, items: {type: string, minLength: 1}}
                additionalProperties: true
            # Promoted from the descriptive `pipeline` block below. `_shared/pipeline_store.py`
            # owns the value rules for these; naming them here is what closes the entry to typos.
            status: {}
            channel: {}
            kyujin_legitimacy: {}
            match_model_version: {}
            match_conflicts: {}
            match_required_gaps: {}
            match_unknowns: {}
            interest_level: {}
            interest_reason: {}
            interest_updated_at: {}
            interest_evidence: {}
            interest_history: {}
            employer_signals: {}
            next_action: {}
            deadline: {}
            closed_reason: {}
            agent_feedback: {}
            reached_stage: {}
            feedback_obtained: {}
            root_cause: {}
            demo_slot: {}
            prep_lines: {}
            gate_override: {}
            action_items:
              type: array
              items:
                type: object
                properties:
                  id: {}
                  text: {}
                  checked: {}
                  created: {}
                  # Written by scripts/check_action.py when the user ticks the item off.
                  checked_at: {}
                additionalProperties: true
            history:
              type: array
              items:
                type: object
                properties:
                  date: {}
                  event: {}
                  event_id: {}
                  # Legacy history rows carry `id`; readers accept it, writers use `event_id`.
                  id: {}
                additionalProperties: true
            # legacy_v1, frozen. Readable on existing entries; the write gate refuses new ones.
            culture_fit_score: {}
            overall_score: {}
            overall_grade: {}
            screening_probability: {}
            platform_probability: {}
            match_score: {}
            predicted_tier: {}
          additionalProperties: true
    additionalProperties: true

  # This definition describes the file, `data/rules.yml`, which is a mapping with one `rules` key.
  # It previously declared a bare array, which no writer or reader has ever produced: both
  # `scripts/calibrate.py` and `scripts/status_bar.py` have always used the mapping. The mismatch
  # survived because `mutate()` only validated `pipeline.yml`, so rules writes were never checked.
  RULES:
    type: object
    required: [rules]
    properties:
      rules:
        type: array
        items:
          type: object
          required: [id, text, status, source, supported_by, created]
          properties:
            id: {type: string, minLength: 1}
            text: {type: string, minLength: 1}
            status: {enum: [candidate, active, retired]}
            # `observed_workflow` is what `scripts/calibrate.py` writes for a rule derived from a
            # repeated root cause across pipeline entries. It was missing from this enum for the
            # same reason as the shape above: nothing validated the file.
            source: {enum: [self_authored, derived_from_rejections, observed_workflow]}
            supported_by: {type: array, items: {type: string}}
            created: {type: string, minLength: 1}
          additionalProperties: true
    additionalProperties: true

# Read forever, never written again. `validate_new_write` and `validate_new_fragment` refuse every
# name below at any depth; `validate_document` accepts them all, because they are on disk already.
#
# `fields` is the flat list every writer is checked against, and it is what the descriptive
# "read-only" and "legacy_v1" notes further down this file actually mean. Those notes used to name
# fields the gate did not know about -- `top_strengths`, `work_style`, `portable_skills` and the
# rest were documented as legacy and were still writable -- so `by_schema` records which document
# each one belongs to and `fields` is derived from it by the test that checks the two agree.
legacy_field_policy:
  readable: true
  writable: false
  by_schema:
    SELF_ANALYSIS_PROFILE:
      # legacy v1 self-analysis. `legacy_self_analysis_profile_v1.readable_fields` below is the
      # descriptive copy of this list; a v2 producer never recreates any of them.
      - top_strengths
      - strength_clusters
      - work_style
      - wellbeing_priorities
      - preferred_role_environment
      - risk_flags
      - preferred_company_type
    CANDIDATE_PROFILE:
      - spi3
      - portable_skills
      - target_company_type
    COMPANY_PROFILE:
      - top_performer_spi3
      - top_performer_portable_skills
      - wellbeing_scores
    MATCH_HISTORY:
      - recruit_style_score
      - persol_style_score
      - culture_fit_score
      - overall_score
      - overall_grade
      - screening_probability
      - platform_probability
    PIPELINE:
      - match_score
      - predicted_tier
      - culture_fit_score
      - screening_probability
      - platform_probability
      - overall_score
      - overall_grade
    RULES: []
  fields:
    - culture_fit_score
    - match_score
    - overall_grade
    - overall_score
    - persol_style_score
    - platform_probability
    - portable_skills
    - preferred_company_type
    - preferred_role_environment
    - predicted_tier
    - recruit_style_score
    - risk_flags
    - screening_probability
    - spi3
    - strength_clusters
    - target_company_type
    - top_performer_portable_skills
    - top_performer_spi3
    - top_strengths
    - wellbeing_priorities
    - wellbeing_scores
    - work_style
  migration: "Preserve existing values verbatim. Do not backfill, reinterpret, or convert them into v3 fields."

# ─────────────────────────────────────────────
# MODEL VERSIONS — read this before adding any field that holds a number
#
#   evidence_based_v3  the default. Independent axes (Eligibility / Required Skill /
#                      MHLW composition distance / Career Values / Interest / Employer
#                      Signals / Evidence). No axis is summed with another, and no field
#                      here may combine them into a ranking value.
#   legacy_v1          retired numeric history, readable only and never produced by the
#                      evidence_based_v3 writers. Engine: _shared/legacy_experimental.py
#                      (opt-in flag required).
#
# Fields below are tagged with the model version they belong to. A legacy_v1 field and an
# evidence_based_v3 field must never be merged into one score, one grade, or one sort key —
# they measure different things and one of them was never validated. Legacy values already
# on disk stay; nothing backfills them and nothing rewrites them.
# ─────────────────────────────────────────────

# ─────────────────────────────────────────────
# SELF_ANALYSIS_PROFILE
# Produced by: jiko-bunseki (raw v2 responses become hypotheses; only user-reviewed statements are canonical)
# Consumed by: job-seeker-agent and downstream skills that receive confirmed career context
# Pipeline position: runs BEFORE job-seeker-agent for direction-setting.
# Raw `jiko_bunseki_submission` exports are not SELF_ANALYSIS_PROFILE values and must never be
# written directly to Vault, matching input, or candidate evidence. `_shared/self_analysis_profile.py`
# performs strict v2 validation without silent normalization. `null` means unassessed; `[]` means the
# user reviewed that list and selected none. A missing v2 marker remains readable legacy v1 history.
# Only explicitly confirmed career context may cross the approval-gated downstream boundary.
# ─────────────────────────────────────────────
self_analysis_profile:
  required:
    - self_analysis_version # integer: 2 for new profiles
    - candidate_name        # string
    - language_preference   # string: "ko" | "ja" | "en"
    - track                 # string: "shinsotsu" | "chuto"
    - interest_hypotheses   # list|null: user-reviewed activity hypotheses
    - behavior_tendencies   # list|null: user-reviewed behavior hypotheses
    - evidence_episodes     # list|null: user-provided episodes; not automatically professional evidence
    - career_self_efficacy  # object|null: perceived confidence, goal, and outcome expectation
    - perceived_barriers    # list|null: user-reported barriers
    - perceived_supports    # list|null: user-reported supports
    - environment_preferences # object|null: independent self-reported preferences
    - value_candidates      # list|null: candidates, not canonical must-have values
    - avoid_candidates      # list|null: candidates, not canonical avoid values

  optional:
    - preferred_environment_hypothesis # list|null: hypothesis + verification question objects
    - verification_questions           # list|null: questions for the user or employer
    - recommended_role_clusters        # list|null: exploration options, never prescriptions
    - self_pr_seeds                    # list|null: only from user-confirmed experiences
    # --- Existing depth/context fields; null until explicitly reviewed ---
    - career_anchors    # object: { primary: string, secondary: list, will_not_give_up: string } | null
    - derailers         # list of objects: { strength: behavior id, overuse_risk, watch_signal } | null
    - energy_map        # object: { energizes: list, drains: list, misfit_flag: string|null } | null
    - career_theme      # string: one line connecting past to future | null
    - career_values     # object: { must_have: list[string], avoid: list[string] } | null
    - career_context_confirmed # boolean; true only after explicit user review and Vault approval where applicable
    - notes             # list|null: boundary and provenance notes

preferred_environment_hypothesis_schema:
  - preference: "string: one of the eight environment preference ids"
    hypothesis: "string: bounded interpretation, not a culture score"
    verification_question: "string: question to verify the hypothesis"
    confidence: "high | medium | low | unknown"

verification_question_schema:
  - "string: question for the user or employer; it is not evidence by itself"

recommended_role_cluster_schema:
  - "string: exploration option only, never an occupation or company recommendation"

self_pr_seed_schema:
  - episode_ref: "string: existing evidence_episodes.id from a user-confirmed episode"
    seed: "string: reflection seed for drafting, not verified professional evidence"

# New profile collection fields use `null` for unassessed and `[]` only when the user explicitly
# reviewed a list and selected none. A missing v2 version marker means legacy v1; readers preserve
# that shape and never infer v2 values from it.
interest_hypothesis_schema:
  - activity: "string: activity id from the checklist"
    response_basis: "string: transparent user response basis"
    confidence: "high | medium | low | unknown"

interest_activity_ids:
  - hands_on_systems
  - investigate_causes
  - create_expressions
  - help_explain
  - persuade_lead
  - organize_processes

behavior_tendency_schema:
  - name: "string: one of the twelve behavior tendency ids"
    self_report: "integer 1–5 | null"
    response_basis: "string: response and episode basis"
    evidence_episode_refs: "list[string]"
    confidence: "high | medium | low | unknown"

evidence_episode_schema:
  - id: "string: unique episode-a | episode-b | user-confirmed id"
    experience_type: "string"
    situation: "string"
    action: "string"
    energy_effect: "energizing | draining | mixed | unknown"
    energy_reason: "string | null"
    source_type: "user"
    confidence: "high | medium | low | unknown"
  # Every behavior_tendencies.evidence_episode_refs entry must resolve to one of these unique ids.

career_self_efficacy_schema:
  learning_confidence: "integer 1–5 | null: perceived ability to learn, not actual ability"
  outcome_expectation: "string | null"
  goal: "string | null"

environment_preferences_v2_schema:
  autonomy: ~
  competence: ~
  relatedness: ~
  structure_preference: ~
  speed_preference: ~
  change_tolerance: ~
  collaboration_preference: ~
  feedback_frequency: ~

# Read-only v1 compatibility fields. New writers must not create these from v2 responses.
legacy_self_analysis_profile_v1:
  readable_fields:
    - top_strengths
    - strength_clusters
    - work_style
    - wellbeing_priorities
    - preferred_role_environment
    - risk_flags
    - preferred_company_type
  migration: "Preserve verbatim. Do not convert scores, clusters, or paired responses into v2 fields."

top_strength_schema:
  - name:    "string: strength id (e.g., 'ownership', 'analysis')"
    score:   "integer 0–16: self-reported reflection value, not a psychometric or fit score"
    cluster: "string: executing | strategic_thinking | relationship_building | influencing"

strength_cluster_schema:
  # All values: integer 0–100 (descriptive normalized reflection summary only; never a fit score)
  executing:              ~
  strategic_thinking:     ~
  relationship_building:  ~
  influencing:            ~

self_work_style_schema:
  # All values: integer 1–5
  autonomy:                 ~
  structure_preference:     ~
  speed_preference:         ~
  change_tolerance:         ~
  collaboration_preference: ~
  feedback_frequency:       ~

# ─────────────────────────────────────────────
# CANDIDATE_PROFILE
# Produced by: job-seeker-agent (STEP 4)
# Consumed by: matching-simulator, company-battlecard, tenshoku-strategy
# ─────────────────────────────────────────────
candidate_profile:
  required:
    - candidate_name      # string: "박민준"
    - work_style_reflection # object: unofficial reflection instrument; not an official test
    - skill_stack         # list of evidence-backed skills; see skill_stack_schema
    - target_role         # string: "Data Engineer"
    - jlpt_level          # string: "native" | "N1" | "N2" | "N3" | "N4" | "None" | null
                          #   "native" = Japanese native speaker; JLPT is asked only when a foreign-national
                          #   signal exists (job-seeker-agent references/segments.md §3)

  optional:
    # --- evidence_based_v3 (all nullable; never backfilled from legacy data) ---
    - portable_skill_allocation  # object: see portable_skill_allocation_schema — 9 integers summing to 29
    - portable_skill_level       # integer 1–5 | null: position level. Stored beside the allocation and
                                 #   EXCLUDED from the composition-distance vector.
    - portable_skill_assessed_at # string YYYY-MM-DD | null
    - career_values              # object: see career_values_schema
    # --- shared ---
    - spi3                 # read-only compatibility alias; not an official test result
    - portable_skills      # read-only legacy 1–5 evidence shape; never converted
    - wellbeing_priorities  # object: self-reported priorities; never turned into a culture total
    - target_company_type   # read-only legacy alias; new writers use environment hypotheses/questions
    - segment                # string: "dai2_shinsotsu" | "standard" | "senior_ic" | "management" | null
                             #   中途 segment (job-seeker-agent references/segments.md §1); null for shinsotsu track
    - visa_status           # string: "PR" | "Engineer/Specialist" | "Student" | null — null for Japanese nationals
    - track                 # string: "shinsotsu" | "chuto"

# Read-only compatibility shape. New writers use work_style_reflection_schema.
spi3_schema:
  # Read-only compatibility shape. New writers use work_style_reflection_schema.
  creation: "float 0–10 | null"
  result:   "float 0–10 | null"
  harmony:  "float 0–10 | null"
  order:    "float 0–10 | null"
  primary_trait: "string: historical hypothesis label | null"

work_style_reflection_schema:
  creation: "float 0–10 | null — reflection output only"
  result:   "float 0–10 | null — reflection output only"
  harmony:  "float 0–10 | null — reflection output only"
  order:    "float 0–10 | null — reflection output only"
  primary_trait: "string | null — user-reviewed hypothesis, not a diagnosis"

portable_skill_allocation_schema:
  # evidence_based_v3. MHLW ポータブルスキル見える化ツール 持ち味 input (_shared/matching_v3.py).
  # Hard rules, enforced by validate_allocation() — a violation is an error, not a rounding job:
  #   - every element is an INTEGER >= 1
  #   - the 9 elements sum to EXACTLY 29
  #   - `portable_skill_level` (1–5) is NOT part of this object and never enters the distance vector
  # The legacy 1–5 `portable_skills` ratings below are NOT convertible into this allocation. There is
  # no defensible mapping from an ordinal rating to a 29-point budget, so none is performed: the user
  # is asked to redistribute 29 points. Both objects may coexist on one profile.
  current_state_assessment: ~   # 現状の把握
  task_setting:             ~   # 課題の設定
  planning:                 ~   # 計画の立案
  task_execution:           ~   # 課題の遂行
  situational_response:     ~   # 状況への対応
  internal_coordination:    ~   # 社内対応
  external_coordination:    ~   # 社外対応
  manager_response:         ~   # 上司対応
  subordinate_management:   ~   # 部下マネジメント

career_values_schema:
  # evidence_based_v3. Compared against company evidence in matching_v3.career_value_results().
  # A `must_have` unmet, or an `avoid` condition present, is a Conflict — never offset by anything else.
  must_have: []   # list of strings
  preferred: []   # list of strings
  avoid:     []   # list of strings

portable_skills_schema:
  # legacy_v1. All values: integer 1–5 | null. 9 elements per _shared/frameworks.md §2.
  # Preserved for existing profiles and for STAR-based resume feedback. NOT used for MHLW
  # composition distance — see portable_skill_allocation_schema.
  現状の把握:       ~   # Situation Assessment
  課題の設定:       ~   # Problem Setting
  計画の立案:       ~   # Planning
  課題の遂行:       ~   # Task Execution
  状況への対応:     ~   # Situational Agility
  社内対応:         ~   # Internal Coordination
  社外対応:         ~   # External Coordination
  上司対応:         ~   # Upward Communication
  部下マネジメント: ~   # Subordinate Management

skill_stack_schema:
  # List of objects with these fields:
  - name:       "string: skill name"
    level:      "string: basic | intermediate | advanced | expert"
    capability: "string: mapped capability from ontology (e.g., 'data analysis')"

wellbeing_schema:
  # All values: integer 1–5 | null
  # 1 = not important at all / 5 = essential
  autonomy:             ~   # 自己決定感
  social_contribution:  ~   # 社会貢献感
  management_quality:   ~   # 上司のマネジメント
  mutual_respect:       ~   # 組織内の相互尊重

# ─────────────────────────────────────────────
# COMPANY_PROFILE
# Produced by: hiring-manager-agent, kigyou-bunseki
# Consumed by: matching-simulator, company-battlecard
# ─────────────────────────────────────────────
company_profile:
  required:
    - company_name        # string
    - position            # string: job title
    - required_skills     # list of strings

  optional:
    # --- evidence_based_v3 (all nullable) ---
    - requirements        # object: see requirements_schema — the structured input for FR-1/FR-2
    - conditions          # object: free-form observed working conditions, one key per condition
                          #   (salary, overtime, remote, ...). Absent key = unknown; never defaulted.
    - mhlw_mapping        # object: see mhlw_mapping_schema
    # --- shared ---
    - industry            # string
    - headcount           # integer | null
    - company_type        # string: "self-developed" | "SIer" | "SES" | "consulting" | "startup" | "large enterprise"
    - chuto_saiyo_ratio   # number 0–100 | null: mid-career hire ratio (中途採用比率), from kigyou-bunseki when available
    - top_performer_spi3    # object: same structure as spi3_schema
    - top_performer_portable_skills  # object: same structure as portable_skills_schema (legacy_v1)
    - accepted_adjacent_skills     # list of strings
    - wellbeing_scores             # object: same structure as wellbeing_schema (legacy_v1 input)
    - salary_range        # object: { min: integer, max: integer, currency: "JPY" }
    - remote_policy       # string: "full-remote" | "hybrid" | "on-site"
    - visa_sponsorship    # boolean | null

requirements_schema:
  # evidence_based_v3. Each list item: { name, status: matched|missing|unknown, evidence,
  # mapping_basis, source_type, source_ref, observed_at, confidence, provenance }.
  # provenance may be synthetic only for clearly marked fixtures, and then source_ref must use
  # the synthetic:// URI scheme. Synthetic evidence is never an observed company fact.
  # `status: unknown` is a first-class value: it is counted and displayed, and it is EXCLUDED
  # from the required-coverage denominator. It is never rounded up to matched.
  hard:             []   # list of objects: { requirement, candidate_evidence, job_evidence, meets: true|false|null }
                         #   `meets` is only honoured when BOTH evidence fields are present; otherwise unknown.
  required_skills:  []
  preferred_skills: []
  experience:       []

mhlw_mapping_schema:
  # evidence_based_v3. Without a recorded mapping basis, NO MHLW distance is generated for the posting.
  mapped_role_profile_id: "string | null — id in the MHLW reference dataset"
  method:     "string: manual | rule_based | heuristic_mapping | null"
  confidence: "string: high | medium | low | unknown"
  evidence:   "string | null — required alongside `method`; the mapping is refused without it.
                 `heuristic_mapping` output is marked NOT official MHLW values."

# ─────────────────────────────────────────────
# MATCH_HISTORY
# Appended to: data/match_history.md
# Produced by: matching-simulator (STEP 4)
#
# Append-only. Entries written before v3 keep their legacy_v1 fields verbatim; nothing
# rewrites, recomputes, or deletes them. New entries are evidence_based_v3 and carry no
# 0–100 score at all — the two shapes are distinguished by `model_version` and are never
# sorted, ranked, or averaged together.
# ─────────────────────────────────────────────
match_history_entry:
  - date                  # string: "YYYY-MM-DD"
  - model_version         # string: "evidence_based_v3" | "legacy_v1" — REQUIRED on every entry
  - candidate_name        # string
  - company_name          # string
  - position_title        # string
  - platform              # string: platform context (e.g., "doda") | null
  - report_file           # string: path to markdown report if saved (e.g., "career-docs/match-xyz.md")

  # --- evidence_based_v3 fields ---
  - decision_status       # string: "proceed" | "review" | "conflict"
  - required_coverage     # number 0–1 | null — confirmed matched / (confirmed matched + confirmed missing)
  - required_coverage_status  # string: "available" | "insufficient_data"
  - portable_skill_status # string: "available" | "insufficient_data" | "unmapped" | "unavailable"
  - portable_skill_distance   # number | null — raw composition distance. NOT a 0–100 fit score.
  - portable_skill_rank   # integer | null (with compared_profiles for the denominator)
  - compared_profiles     # integer | null
  - conflicts             # list of strings — confirmed blockers
  - missing_information   # list of strings — what would change the result if confirmed

  # --- legacy_v1 fields: read-only history, NOT written for new entries ---
  - recruit_style_score   # integer 0–100 | absent on v3 entries
  - persol_style_score    # integer 0–100 | absent on v3 entries
  - culture_fit_score     # integer 0–100 | absent on v3 entries (calculation discontinued)
  - overall_score         # integer 0–100 | absent on v3 entries
  - overall_grade         # string: "A" | "B" | "C" | "D" | absent on v3 entries

# ─────────────────────────────────────────────
# PIPELINE
# File: data/pipeline.yml (CWD-relative, per Output Contract / Rule C)
# The per-company job-search state hub. One entry per company, keyed by slug.
# Written by: kigyou-bunseki (entry + kyujin_legitimacy),
#             matching-simulator (match_model_version, decision_status, match_conflicts,
#                                 match_required_gaps, match_unknowns; interest_* only on explicit user instruction),
#             tenshoku-strategy STEP 6 / 3 / 3-2 (stage transitions, history, deadlines,
#             closed_reason + agent_feedback on お見送り), company-battlecard (history event),
#             career-agent `approve` of a company event (stage, next_action, deadline, history —
#             it owns none of the other fields and never overwrites them)
# Read by:    CLAUDE.md onboarding (session-resume kanban), tenshoku-strategy STEP 6
#             (funnel / pattern analysis; renders career-docs/applications.md as a view),
#             scripts/status_bar.py, scripts/calibrate.py, scripts/legacy_calibrate.py (legacy only)
#
# This is the ONLY per-company state store in the suite. The Career Vault keeps the agent's flow
# state (track, stage, deadlines, event ledger); it deliberately does not mirror the company list.
#
# Upsert rules (all writers): read the whole file → modify → rewrite. Match entries by `slug`.
# Never delete an entry — closed entries feed funnel analysis. Set `closed: true` instead.
# Every write follows Rule C: create data/ in the invocation directory if missing, then print
# the absolute path and verify the file exists.
# ─────────────────────────────────────────────
pipeline:
  updated: "string: YYYY-MM-DD — date of last write"
  companies:
    - slug:          "string: same slug as data/company_profiles/{slug}.yml — the join key"
      name:          "string: display name"
      stage:         "integer 0–7: CLAUDE.md Japan 転職 Market Stage Map"
      status:        "string: free-text detail (e.g., '一次面接 scheduled 2026-07-10')"
      channel:       "string: site | agent | scout | referral | null"
      kyujin_legitimacy: "string: green (信頼度高) | yellow (要注意) | red (要確認) — kigyou-bunseki 求人の真正性 tiers | null"

      # ── Match result (evidence_based_v3) ─────────────────────────────
      # Written by matching-simulator. Replaces match_score as the latest-result field.
      match_model_version: "string: evidence_based_v3 | legacy_v1 | null — which engine produced the
                              fields below. Required whenever any of them is non-null."
      decision_status:     "string: proceed | review | conflict | null — NOT a score and NOT a ranking
                              value. `proceed` requires no confirmed hard conflict, unresolved
                              required unknown, or confirmed required skill/experience gap; it is
                              not a recommendation or an outcome estimate. Do not order the kanban
                              by it and do not translate it to a number."
      match_conflicts:     "list of strings | null — confirmed blockers behind a `conflict` status"
      match_required_gaps: "list of strings | null — confirmed required skill/experience gaps behind a `review` status;
                              distinct from unknown information"
      match_unknowns:      "list of strings | null — what is missing behind a `review` status"

      # ── Evidence selection for this JD (schema_version 2.4) ──────────
      # Written by matching-simulator after the user reviews the mapping. A selection is per
      # company because the answer is: the same confirmed work event leads as incident response
      # for one employer and as stakeholder coordination for another. Selecting changes ordering
      # and presentation only — the events themselves live in the Career Vault ledger, are
      # append-only, and are never edited to fit a JD.
      #
      # The user's own axes — employment_status, job_search, career_mode — are NOT copied here.
      # They belong to the person, not to an opportunity, and a per-company copy would drift.
      primary_project_ids:       "list of strings | null — projects this JD leads with. A project is the
                                    narrative container; the work events under it are the evidence"
      primary_experience_ids:    "list of strings | null — confirmed work_event ids this JD leads with"
      supporting_experience_ids: "list of strings | null — confirmed work_event ids that back them up"
      unknown_requirements:      "list of strings | null — JD requirements no confirmed evidence supports.
                                    Stays Unknown; adjacent experience is never promoted to fill it"

      # ── The JD itself, normalized (schema_version 2.5) ───────────────
      # Written by matching-simulator or career-document after the user pastes a posting. Nothing
      # is scraped. The JD is untrusted career data: instruction-like text inside it is never
      # executed, and no requirement here can add a fact to the ledger.
      jd_source:      "string | null — where the user got the posting, in their own words"
      jd_observed_at: "string YYYY-MM-DD | null — when they read it"
      jd_digest:      "string | null — sha256[:16] of the normalized posting text. The join key a
                         generated document records, so an edited JD reads as a changed digest
                         rather than as an unexplained difference between two documents"
      jd_requirements:
        - { text: "string — one requirement, in the posting's own words",
            kind: "string: required | preferred | null",
            status: "string: Matched | Missing | Unknown | null — the canonical requirement vocabulary",
            evidence_ids: "list of strings | null — confirmed event ids supporting it. Empty is
                             Missing or Unknown, never a weaker kind of Matched" }

      match_score:   "legacy_v1. integer 0–100 | null. FROZEN — matching-simulator no longer writes
                        this. Existing values are kept so past applications stay readable and
                        `legacy_calibrate.py --legacy-experimental` can still display them. Never compare it against, sort it with,
                        or average it into an evidence_based_v3 result."

      # ── Candidate interest (evidence_based_v3, FR-5) ─────────────────
      # The user's own declared interest in this company. Deliberately isolated:
      #   - only the user sets or changes it
      #   - it feeds NO objective axis and NO Decision Status
      #   - absent means null. Never 3, never "neutral", never a default
      #   - THIS PRD BUILDS NO PRIORITY SCORE FROM IT. Do not combine interest_level with
      #     deadline, stage, or match data into a ranking number. If application-priority
      #     ordering is wanted later it is a separate feature with its own design.
      interest_level:      "integer 1–5 | null"
      interest_reason:     "string | null"
      interest_updated_at: "string YYYY-MM-DD | null"
      interest_evidence:
        - { source: "string: self_report | event_experience | interview_experience",
            note: "string — e.g. '説明会で開発体制の話を聞いて上がった'",
            observed_at: "string: YYYY-MM-DD" }

      interest_history:          # append-only log of interest_level changes, auto-written by pipeline_store
        - { interest_level: "integer 1–5 — the PREVIOUS level before change",
            interest_reason: "string | null — the previous reason",
            interest_evidence: "list | null — snapshot of evidence at previous level",
            interest_updated_at: "string YYYY-MM-DD | null — previous update timestamp",
            changed_at: "string YYYY-MM-DD — when the level was overwritten" }

      # ── Employer signals (evidence_based_v3, FR-6) ───────────────────
      # Observed events only. No signal is converted into an outcome estimate, and the ABSENCE of
      # signals is not a negative evaluation — it is simply nothing observed.
      employer_signals:
        - { type: "string: scout | message | interview_invite | pass_notice | rejection",
            observed_at: "string: ISO datetime",
            source: "string — where it was observed" }

      next_action:   "string | null"
      deadline:      "string YYYY-MM-DD: nearest date — 面接日, 回答期限, … | null"
      closed:        "boolean: true on 内定承諾 / 内定辞退 / お見送り / 自ら見送り"
      closed_reason: "string | null — coarse label: お見送り | 内定辞退 | 自己見送り | 内定承諾"
      agent_feedback: "string | null — VERBATIM CA/RA rejection feedback text (原文, in its original
                        language). Populate ONLY when channel is agent | scout — a real recruiter
                        relays the company's actual reason. site | referral rarely yield real reasons
                        (定型 お祈りメール); leave null. This is the raw source for the 面接遂行品質
                        blocker tier in tenshoku-strategy senko-tracking §3."

      # ── Outcome record (v1.7) ────────────────────────────────────────
      # Written by tenshoku-strategy STEP 6 when an entry closes. Without these the suite
      # stores legacy forecast labels it can never use for v3. Required before `closed: true`
      # may be set when an outcome record is being created.
      predicted_tier:    "legacy_v1. string: A | B | C | D | F | null — grade at application time,
                            frozen. Derived from the legacy match_score, so it exists only on entries
                            created before evidence_based_v3. FROZEN: no new value is written, and no
                            v3 result is converted into a tier. `legacy_calibrate.py` still displays the
                            existing ones against reached_stage, labelled legacy_v1 — that comparison
                            scores the OLD grade, not the v3 diagnosis. evidence_based_v3 deliberately
                            produces nothing to calibrate against a hiring outcome: it is a
                            diagnostic, not an outcome model."
      reached_stage:     "integer 0–7 | null — the furthest stage actually reached. Compared
                            against predicted_tier only in the explicit legacy viewer."
      feedback_obtained: "boolean — whether a real rejection reason was obtained (agent_feedback
                            non-null and not a form letter). Route-vs-learning join key."
      root_cause:        "string | null — ONE coarse label, reused verbatim across companies so it
                            can be counted (e.g. '数値なしエピソード', 'PREP構造欠如', '企業理解不足').
                            Frequency across entries is the promotion key for data/rules.yml."

      # ── Measurement-only fields (v1.7) ───────────────────────────────
      # These record variables the PRD proposed turning into rules. The supporting evidence was
      # a single case each, so they are measured rather than enforced. No skill may branch on
      # them beyond the diversity warning below.
      demo_slot:     "string: yes | company_test | no | unknown — does this 選考 have a slot where
                        the candidate demonstrates their OWN artifact?
                          yes           = candidate brings and demos their own work
                          company_test  = company sets the exercise (実技テスト). A DIFFERENT axis —
                                          the evaluator still picks the ground. Do not merge with `yes`.
                          no            = verbal explanation only
                          unknown       = not determinable from the 求人票 / process description.
                                          Default. Never guess.
                        Carries NO scoring weight. Used only for the diversity warning: if recent
                        entries are all `no`, surface that the user is only competing on one axis."
      prep_lines:    "integer | null — total lines of prep documents written for this company.
                        Recorded so the user can test the 'prep volume does not predict outcome'
                        claim against their own data. No cap is enforced."
      gate_override: "boolean — true when the user chose to continue after a confirmed conflict
                        or a routing warning. Lets workflow analysis record the user's override;
                        it does not alter the objective result."

      # ── Execution gate source (v1.7) ─────────────────────────────────
      # The repeated failure this suite exists to prevent: the checklist existed and went
      # unchecked. status_bar.py counts unchecked items; the count blocks new interview-prep
      # generation for the same company.
      action_items:
        - { id: "string: short slug, unique within the company entry",
            text: "string: the action, in the user's own words",
            checked: "boolean",
            created: "string: YYYY-MM-DD",
            checked_at: "string: YYYY-MM-DD | absent — set by scripts/check_action.py when ticked" }

      history:       # append-only projection log; canonical evidence remains in events.jsonl
        - { date: "YYYY-MM-DD", event: "short event title",
            event_id: "string | optional — idempotency key for career-agent events" }
          # Legacy entries may contain id; readers accept it, writers use event_id.

# ─────────────────────────────────────────────
# RULES
# File: data/rules.yml (CWD-relative, per Output Contract / Rule C)
# The user's own standing rules, re-surfaced by the status bar before every interview.
#
# Written by: career-agent (`rules` subcommand) — ONLY on explicit user approval.
# Read by:    scripts/status_bar.py (status bar), mock-interviewer, tenshoku-strategy
#
# Promotion rule: a candidate becomes `active` only when at least TWO distinct pipeline
# entries support it. A single rejection reason is one company's measurement, not a
# property of the candidate — promoting it teaches the user to fix the wrong axis.
# `self_authored` rules skip the threshold: the user wrote them deliberately.
#
# Skills may READ this file. Skills may NOT write, edit, or retire rules — that path
# runs through career-agent with user approval, so the agent cannot quietly relax a
# constraint it keeps failing.
# ─────────────────────────────────────────────
rules:
  - id:           "string: short slug"
    text:         "string: the rule in the user's own words, verbatim. This exact string is
                     re-surfaced before interviews, so do not paraphrase or translate it."
    status:       "string: candidate | active | retired"
    source:       "string: self_authored | derived_from_rejections | observed_workflow
                     observed_workflow is written by scripts/calibrate.py when one root_cause
                     repeats across entries. It is derived, so it obeys the two-entry threshold."
    supported_by: "list of strings: pipeline slugs backing this rule. Length >= 2 required to
                     move derived_from_rejections rules to `active`. Empty for self_authored."
    created:      "string: YYYY-MM-DD"
