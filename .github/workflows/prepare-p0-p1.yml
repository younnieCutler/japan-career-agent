name: prepare-p0-p1

on:
  push:
    branches:
      - ux/job-seeker-p0-p1

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: fix source
        run: python scripts/fix_p0_p1_source.py
      - name: install frontend deps
        working-directory: frontend
        run: npm ci
      - name: frontend tests
        working-directory: frontend
        run: npm test
      - name: localization policy
        run: python skills/career-agent/gui/test_product_localization.py
      - name: build production frontend bundle
        working-directory: frontend
        run: npm run build
      - name: sanity checks
        run: git diff --check
      - name: write fixed source and bundle
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/screens/Applications.jsx skills/career-agent/gui/static/app
          git commit -m "align P0 P1 source with localization policy"
          git push origin HEAD:ux/job-seeker-p0-p1
