name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install runtime deps
        run: python3 -m pip install --quiet pyyaml
      - name: career-agent test suite
        run: python3 skills/career-agent/test_career_agent.py
      - name: scoring self-test
        run: python3 _shared/scoring.py --self-test
      - name: status bar tests
        run: python3 scripts/test_status_bar.py
      - name: calibration tests
        run: python3 scripts/test_calibrate.py
      - name: SKILL.md reference paths
        run: python3 scripts/check_reference_paths.py
