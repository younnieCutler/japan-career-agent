name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: career-agent test suite
        run: python3 skills/career-agent/test_career_agent.py
      - name: scoring self-test
        run: python3 _shared/scoring.py --self-test
