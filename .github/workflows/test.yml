name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install runtime deps
        run: python -m pip install --quiet -r requirements.txt
      - name: lint
        run: |
          python -m pip install --quiet "ruff>=0.8,<1"
          python -m ruff check .
      - name: active policy scan
        run: python scripts/check_policy.py
      - name: external claim freshness
        run: python scripts/check_claim_freshness.py
      - name: career-agent test suite
        run: python skills/career-agent/test_career_agent.py
      - name: career-agent routing tests
        run: python skills/career-agent/test_routing.py
      - name: matching v3 acceptance tests
        run: python _shared/test_matching_v3.py
      - name: legacy_v1 scorer self-test (opt-in path)
        run: python _shared/legacy_experimental.py --self-test
      - name: legacy calibration read-only path
        run: python scripts/legacy_calibrate.py --legacy-experimental
      - name: status bar tests
        run: python scripts/test_status_bar.py
      - name: calibration tests
        run: python scripts/test_calibrate.py
      - name: check_action tests
        run: python scripts/test_check_action.py
      - name: pipeline integration test (approve -> status_bar/check_action/calibrate)
        run: python scripts/test_pipeline_integration.py
      - name: shared pipeline CLI tests
        run: python scripts/test_pipeline_cli.py
      - name: SKILL.md reference paths
        run: python scripts/check_reference_paths.py
      - name: AGENTS lazy reference paths
        run: python scripts/check_agent_context.py
      - name: policy and schema regression tests
        run: python scripts/test_policy.py
      - name: plugin manifest consistency
        run: python scripts/check_manifest_consistency.py
      - name: README consistency
        run: python scripts/check_readme_consistency.py
      - name: self-analysis checklist contract
        run: python skills/jiko-bunseki/tests/test_checklist_contract.py
