name: fix-import-route

on:
  push:
    branches: [ux/career-file-import-localization]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ux/career-file-import-localization
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: patch POST route allowlist
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('skills/career-agent/gui/server.py')
          text = path.read_text(encoding='utf-8')
          anchor = '            "/api/career/assign-project-context",\n'
          replacement = anchor + '            "/api/career/import-text",\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one route anchor, found {text.count(anchor)}')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: install locked dependencies
        run: python -m pip install --quiet --require-hashes -r requirements.lock
      - name: authenticated import route regression
        run: python skills/career-agent/gui/test_import_text.py
      - name: persist only verified product change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          rm -f .github/workflows/fix-import-route.yml
          git add skills/career-agent/gui/server.py .github/workflows/fix-import-route.yml
          git diff --cached --quiet || git commit -m 'Expose authenticated career import route'
          git push origin HEAD:ux/career-file-import-localization
