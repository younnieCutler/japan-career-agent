name: prepare-file-import

on:
  push:
    branches: [ux/career-file-import-localization]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ux/career-file-import-localization
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: apply scoped source changes
        run: |
          python .github/fix_apply_anchor.py
          python .github/apply_file_import.py
          python .github/fix_localization_test.py
          python .github/fix_release_heading.py
      - name: sync release copies and SBOM
        run: python scripts/sync_version.py
      - name: install locked Python dependencies
        run: |
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --require-hashes -r requirements-dev.lock
      - name: build and test frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: targeted Python regressions
        run: |
          python skills/career-agent/gui/test_import_text.py
          python skills/career-agent/test_localization.py
          python scripts/check_dependency_lock.py
          python scripts/check_release_consistency.py
          python scripts/sync_version.py --check
      - name: remove temporary preparation scripts before product verification
        run: |
          rm -f .github/prepare_file_import.py .github/apply_file_import.py .github/fix_apply_anchor.py .github/fix_localization_test.py .github/fix_release_heading.py
      - name: repository verification matrix
        run: python scripts/run_all_checks.py
      - name: persist verified product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pyproject.toml requirements.txt requirements.lock sbom.cdx.json CHANGELOG.md README.md README_ko.md README_ja.md docs/upgrading.md docs/upgrading_ko.md docs/upgrading_ja.md
          git add .claude-plugin/plugin.json .codex-plugin/plugin.json packaging/npm/package.json
          git add skills/career-agent/gui/import_text.py skills/career-agent/gui/test_import_text.py skills/career-agent/gui/server.py skills/career-agent/localization.py skills/career-agent/ux.py skills/career-agent/test_localization.py scripts/run_all_checks.py
          git add frontend/src/screens/Career.jsx frontend/src/screens/Career.test.jsx skills/career-agent/gui/static/app/app.js skills/career-agent/gui/static/app/app.css
          git diff --cached --quiet || git commit -m 'Prepare file import and localized statuses'
          git push origin HEAD:ux/career-file-import-localization
