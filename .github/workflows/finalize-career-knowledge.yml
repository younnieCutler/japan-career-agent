name: finalize-career-knowledge

on:
  push:
    branches:
      - feat/career-knowledge-completion

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: finalize release metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          heading = '## [2.33.0] - 2026-09-11'
          if heading not in text:
              prefix = '''# Changelog\n\n## [2.33.0] - 2026-09-11\n\n- Complete the Japanese career knowledge program by revalidating the remaining market guidance, promoting eleven scoped knowledge items only after recorded semantic scenario review, and keeping market claims separate from personal candidate evidence.\n- Integrate evidence-safe 3C4P elicitation, short-tenure and gap handling, motivation consistency, progressive document readability, career-relevant self-introduction, weakness mitigation, salary-anchor checks, AI-draft defensibility, and resume-role boundaries into the relevant shipped Skills without fixed hiring weights or invented metrics.\n- Retain the evaluation artifact plus deterministic scope, freshness, lifecycle, and promotion gates so changes to a claim, behavior, scope, lifecycle revision, or required scenario invalidate the corresponding promotion receipt.\n\n'''
              if not text.startswith('# Changelog\n'):
                  raise SystemExit('unexpected CHANGELOG header')
              text = prefix + text[len('# Changelog\n\n'):]
              path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python scripts/sync_version.py
          git rm .github/workflows/finalize-career-knowledge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md pyproject.toml .claude-plugin/plugin.json .codex-plugin/plugin.json packaging/npm/package.json sbom.cdx.json docs/upgrading.md docs/upgrading_ko.md docs/upgrading_ja.md
          git commit -m 'release: finalize 2.33.0 metadata'
          git push origin HEAD:feat/career-knowledge-completion
