name: judgment-slice-sync

on:
  push:
    branches:
      - feat/judgment-impact-workflow

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22.14.0'

      - name: apply source, docs, and release patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          # HTTP transport only dispatches; semantic judgment rules stay in gui/judgments.py.
          replace_once(
              "skills/career-agent/gui/server.py",
              "import gui.cases as cases\n",
              "import gui.cases as cases\nimport gui.judgments as judgment_api\n",
          )
          replace_once(
              "skills/career-agent/gui/server.py",
              '            "INVALID_RELATIONSHIP": HTTPStatus.CONFLICT,\n',
              '            "INVALID_RELATIONSHIP": HTTPStatus.CONFLICT,\n'
              '            "JUDGMENT_PHASE_ORDER": HTTPStatus.CONFLICT,\n'
              '            "JUDGMENT_PHASE_EXISTS": HTTPStatus.CONFLICT,\n'
              '            "JUDGMENT_SCHEMA_NEWER": HTTPStatus.CONFLICT,\n'
              '            "REVIEW_POLICY_UNKNOWN": HTTPStatus.CONFLICT,\n'
              '            "JUDGMENT_NOT_FOUND": HTTPStatus.NOT_FOUND,\n',
          )
          replace_once(
              "skills/career-agent/gui/server.py",
              '            "/api/applications",\n            "/api/documents",\n',
              '            "/api/applications",\n            "/api/documents",\n            "/api/judgments",\n',
          )
          replace_once(
              "skills/career-agent/gui/server.py",
              '            "/api/applications": lambda: applications_payload(self.server.home),\n            "/api/documents": lambda: documents_payload(self.server.home),\n',
              '            "/api/applications": lambda: applications_payload(self.server.home),\n'
              '            "/api/documents": lambda: documents_payload(self.server.home),\n'
              '            "/api/judgments": lambda: judgment_api.payload(\n'
              '                self.server.home, target_ref=self._query_value("target_ref")\n'
              '            ),\n',
          )
          replace_once(
              "skills/career-agent/gui/server.py",
              '            "/api/self-analysis", "/api/applications", "/api/documents",\n',
              '            "/api/self-analysis", "/api/applications", "/api/documents",\n'
              '            "/api/judgments",\n',
          )
          replace_once(
              "skills/career-agent/gui/server.py",
              '            "/api/applications/documents",\n            "/api/artifacts",\n',
              '            "/api/applications/documents",\n'
              '            "/api/judgments/initial",\n'
              '            "/api/judgments/agent",\n'
              '            "/api/judgments/final",\n'
              '            "/api/judgments/outcome",\n'
              '            "/api/artifacts",\n',
          )
          replace_once(
              "skills/career-agent/gui/server.py",
              '            elif path == "/api/applications/companies":\n',
              '            elif path == "/api/judgments/initial":\n'
              '                result = judgment_api.start(self.server.home, payload)\n'
              '            elif path == "/api/judgments/agent":\n'
              '                result = judgment_api.assess(self.server.home, payload)\n'
              '            elif path == "/api/judgments/final":\n'
              '                result = judgment_api.finalize(self.server.home, payload)\n'
              '            elif path == "/api/judgments/outcome":\n'
              '                result = judgment_api.record_result(self.server.home, payload)\n'
              '            elif path == "/api/applications/companies":\n',
          )

          # Feature-owned copy is merged into the same server catalog used by every GUI screen.
          replace_once(
              "skills/career-agent/gui/templates.py",
              "from localization import gui_catalog, normalize_language\n",
              "from localization import gui_catalog, normalize_language\nfrom gui.judgment_copy import judgment_messages\n",
          )
          replace_once(
              "skills/career-agent/gui/templates.py",
              'def gui_messages(language: object) -> dict[str, str]:\n    """Return one complete locale catalog for the data-free browser client."""\n    return gui_catalog(language)\n',
              'def gui_messages(language: object) -> dict[str, str]:\n'
              '    """Return one complete locale catalog for the data-free browser client."""\n'
              '    catalog = gui_catalog(language)\n'
              '    catalog.update(judgment_messages(language))\n'
              '    return catalog\n',
          )

          # The production Applications surface is the first L3 caller. Inactive applications stay read-only.
          replace_once(
              "frontend/src/screens/Applications.jsx",
              'import { read, write } from "../api.js";\n',
              'import { read, write } from "../api.js";\nimport { ApplicationJudgment } from "../applicationJudgment.jsx";\n',
          )
          replace_once(
              "frontend/src/screens/Applications.jsx",
              '      </section>\n\n      {position.status === "active" ? (\n',
              '      </section>\n\n'
              '      {position.status === "active" ? <ApplicationJudgment positionRef={position.ref} /> : null}\n\n'
              '      {position.status === "active" ? (\n',
          )
          replace_once(
              "frontend/src/applicationJudgment.jsx",
              '<section className="record stack" aria-label={t("judgment.title")}>',
              '<section className="record__section stack" aria-label={t("judgment.title")}>',
          )

          # Remove implementation jargon from visible waiting copy.
          for locale, old, new in (
              ("ko", "Host가 이 판단에 대한 Agent 분석을 기록하면 비교 결과가 표시됩니다.", "Agent 분석이 기록되면 비교 결과가 표시됩니다."),
              ("ja", "Hostがこの判断へのAgent分析を記録すると比較結果を表示します。", "Agent分析が記録されると比較結果を表示します。"),
              ("en", "The comparison appears after the Host records an Agent assessment for this decision.", "The comparison appears after an Agent assessment is recorded for this decision."),
          ):
              replace_once("skills/career-agent/gui/judgment_copy.py", old, new)

          # Host-side CLI can record the agent phase without making Python call an LLM itself.
          replace_once(
              "skills/career-agent/dispatch.py",
              "from models import CareerError\n",
              "from models import CareerError\nfrom judgments import judgment_timeline, list_judgments, record_agent_assessment\n",
          )
          replace_once(
              "skills/career-agent/dispatch.py",
              '    if args.command == "skill-report":\n        return report_invocation(\n            home, args.invocation_id, status=args.status, summary=args.summary,\n            artifacts=args.artifacts, evidence_used=args.evidence_used,\n            tools_used=args.tools_used, error=args.error, signals=args.signals,\n        )\n    if args.command == "status":\n',
              '    if args.command == "skill-report":\n'
              '        return report_invocation(\n'
              '            home, args.invocation_id, status=args.status, summary=args.summary,\n'
              '            artifacts=args.artifacts, evidence_used=args.evidence_used,\n'
              '            tools_used=args.tools_used, error=args.error, signals=args.signals,\n'
              '        )\n'
              '    if args.command == "judgment":\n'
              '        if args.action == "list":\n'
              '            if args.judgment_id:\n'
              '                return {"judgment": judgment_timeline(home, args.judgment_id)}\n'
              '            rows = list_judgments(home)\n'
              '            if args.target_ref:\n'
              '                rows = [row for row in rows if row.get("target_ref") == args.target_ref]\n'
              '            return {"judgments": rows}\n'
              '        if not args.judgment_id or not args.recommendation:\n'
              '            raise CareerError("judgment assess requires --id and --recommendation", code="INVALID_INPUT")\n'
              '        return record_agent_assessment(\n'
              '            home, args.judgment_id,\n'
              '            recommendation=args.recommendation, confidence=args.confidence,\n'
              '            reasons=args.reasons, evidence_refs=args.evidence_refs, unknowns=args.unknowns,\n'
              '        )\n'
              '    if args.command == "status":\n',
          )
          replace_once(
              "skills/career-agent/command_line.py",
              '    add_output_format(skill_report_parser)\n    status_parser = subparsers.add_parser("status")\n',
              '    add_output_format(skill_report_parser)\n'
              '    judgment_parser = subparsers.add_parser(\n'
              '        "judgment",\n'
              '        help="list consequential judgments or let a Host record the Agent assessment",\n'
              '    )\n'
              '    add_vault_argument(judgment_parser)\n'
              '    judgment_parser.add_argument("action", choices=("list", "assess"))\n'
              '    judgment_parser.add_argument("--id", dest="judgment_id", help="judgment id to inspect or assess")\n'
              '    judgment_parser.add_argument("--target-ref", help="filter list output to one durable target")\n'
              '    judgment_parser.add_argument("--recommendation", choices=("proceed", "hold", "stop", "unknown"))\n'
              '    judgment_parser.add_argument("--confidence", choices=("high", "medium", "low", "unknown"), default="unknown")\n'
              '    judgment_parser.add_argument("--reason", dest="reasons", action="append", default=None)\n'
              '    judgment_parser.add_argument("--evidence", dest="evidence_refs", action="append", default=None)\n'
              '    judgment_parser.add_argument("--unknown", dest="unknowns", action="append", default=None)\n'
              '    add_output_format(judgment_parser)\n'
              '    status_parser = subparsers.add_parser("status")\n',
          )

          # Architecture ownership includes the policy owner and both GUI adapters.
          replace_once(
              "scripts/check_career_agent_boundaries.py",
              '    "judgments",\n    "dispatch",\n',
              '    "judgments",\n    "review_policy",\n    "dispatch",\n',
          )
          replace_once(
              "scripts/check_career_agent_boundaries.py",
              '    "gui.cases",\n    "gui.artifacts",\n',
              '    "gui.cases",\n    "gui.artifacts",\n    "gui.judgments",\n    "gui.judgment_copy",\n',
          )
          replace_once(
              "scripts/check_career_agent_boundaries.py",
              '    "case_store", "artifact_store", "skill_invocations", "execution_plans", "judgments",\n    "gui.templates", "gui.views_read", "gui.tanaoroshi",\n    "gui.cases", "gui.artifacts",\n',
              '    "case_store", "artifact_store", "skill_invocations", "execution_plans", "judgments",\n'
              '    "review_policy",\n'
              '    "gui.templates", "gui.views_read", "gui.tanaoroshi",\n'
              '    "gui.cases", "gui.artifacts", "gui.judgments", "gui.judgment_copy",\n',
          )
          replace_once(
              "scripts/check_career_agent_boundaries.py",
              '    "gui.cases", "gui.artifacts",\n}\n',
              '    "gui.cases", "gui.artifacts", "gui.judgments", "gui.judgment_copy",\n}\n',
          )
          replace_once(
              "scripts/check_career_agent_boundaries.py",
              '    "list_judgments": "judgments",\n',
              '    "list_judgments": "judgments",\n'
              '    "policy_for": "review_policy",\n'
              '    "judgment_policy": "review_policy",\n'
              '    "policy_catalog": "review_policy",\n',
          )

          # Explicitly register the new Python regression and keep the runbook count honest.
          replace_once(
              "scripts/run_all_checks.py",
              '("career-agent human judgment", (PYTHON, "skills/career-agent/test_judgments.py")),\n',
              '("career-agent human judgment", (PYTHON, "skills/career-agent/test_judgments.py")),\n'
              '    ("career-agent judgment impact policy", (PYTHON, "skills/career-agent/test_review_policy.py")),\n',
          )
          replace_once(
              "docs/MAINTAINER_RUNBOOK.md",
              "All 95 repository checks passed.",
              "All 96 repository checks passed.",
          )

          # Add one CLI regression to prove the Host bridge records only the agent phase.
          test_path = Path("skills/career-agent/test_review_policy.py")
          text = test_path.read_text(encoding="utf-8")
          text = text.replace(
              "import case_store\n",
              "import case_store\nfrom command_line import build_parser\nfrom dispatch import run_command\n",
              1,
          )
          anchor = "    def test_final_and_outcome_stay_out_of_canonical_career_state(self) -> None:\n"
          cli_test = '''    def test_host_cli_records_agent_assessment_without_calling_an_llm(self) -> None:\n        started = gui_judgments.start(self.home, {\n            "subject": "application",\n            "target_ref": self.application["case_id"],\n            "decision": "hold",\n        })\n        args = build_parser().parse_args([\n            "judgment", "assess", "--vault", str(self.home.path),\n            "--id", started["judgment_id"],\n            "--recommendation", "proceed",\n            "--confidence", "medium",\n            "--reason", "confirmed scope fits",\n            "--unknown", "allocation ratio",\n        ])\n        result = run_command(args, {})\n        self.assertEqual(result["phase"], "agent_assessment")\n        timeline = gui_judgments.payload(self.home, target_ref=self.application["case_id"])["judgments"][0]\n        self.assertEqual(timeline["agent_assessment"]["recommendation"], "proceed")\n        self.assertEqual(timeline["human_initial"]["decision"], "hold")\n\n'''
          if anchor not in text:
              raise SystemExit("missing CLI test anchor")
          test_path.write_text(text.replace(anchor, cli_test + anchor, 1), encoding="utf-8")

          # Human-oversight docs now describe the actual shipped production path, not the foundation plan.
          replace_once(
              "docs/HUMAN_OVERSIGHT.md",
              "The intended policy has four levels:",
              "The deterministic policy in `skills/career-agent/review_policy.py` has four levels:",
          )
          replace_once(
              "docs/HUMAN_OVERSIGHT.md",
              "The foundation component is intentionally not imported into a production workflow yet. A later\nslice must route only L3 decisions through it after the deterministic impact policy exists. L0-L2\nworkflows must remain unchanged unless their own requirements say otherwise. Because this slice does\nnot import the primitive from the production app, it intentionally causes no committed GUI-bundle\nchange; the bundle-drift gate must remain clean.\n\nBefore any production L3 caller renders agent `evidence_refs`, those references must be resolved\nthrough the existing evidence boundary. An unresolved string is `Unknown`, not evidence merely\nbecause it has evidence-shaped syntax.\n",
              "The production Applications screen now routes active application decisions through this gate.\nThe browser sends the semantic subject and decision only; the server derives L3 from\n`review_policy.py`, so a caller cannot downgrade the interaction by supplying an impact string.\nL0-L2 workflows remain unchanged. After the initial write succeeds, the screen shows a waiting state\nuntil an Agent assessment is recorded through the host-neutral runtime/API boundary; the server does\nnot fabricate a recommendation from profile completeness or matching heuristics.\n\nThe browser projection intentionally withholds raw agent `evidence_refs` and exposes only their count\nuntil those references are resolved through the existing evidence boundary. An unresolved string is\n`Unknown`, not evidence merely because it has evidence-shaped syntax.\n",
          )
          replace_once(
              "docs/HUMAN_OVERSIGHT.md",
              "The existing approval UI already shows exact before/after state, Unknowns, evidence, and effect. The\nnext implementation slice should standardize the L2/L3 review packet as:",
              "The existing approval UI already shows exact before/after state, Unknowns, evidence, and effect. A\nfuture cross-surface slice can standardize the remaining L2/L3 review packet vocabulary as:",
          )
          replace_once(
              "docs/HUMAN_OVERSIGHT.md",
              "1. **Foundation** — append-only judgment ledger, fail-closed read contract, concurrency/phase-order\n   regression tests, and a human-first source-level GUI primitive. (This document's initial slice.)\n2. **Impact policy** — deterministic L0-L3 classification and a normalized review packet.\n3. **Workflow wiring** — selected L3 company/application/offer/strategy decisions use the judgment\n   gate; L0-L2 remain fast; evidence references are resolved before rendering.\n4. **Calibration** — bounded read projection and optional oversight-health signals after real usage\n   data exists.\n",
              "1. **Foundation** — append-only judgment ledger, fail-closed read contract, concurrency/phase-order\n   regression tests, and the human-first GUI primitive.\n2. **Impact + application wiring** — deterministic L0-L3 policy, authenticated judgment API,\n   production application gate, Host assessment bridge, human-final/outcome flow, and localized copy.\n3. **Broader review packet/evidence resolution** — resolve evidence references before rendering them\n   and apply the same bounded policy to additional company/offer/strategy surfaces where justified.\n4. **Calibration** — bounded read projection and optional oversight-health signals after real usage\n   data exists.\n",
          )
          replace_once(
              "docs/HUMAN_OVERSIGHT.md",
              "The foundation is not merge-ready merely because its focused tests pass.",
              "A Human Oversight slice is not merge-ready merely because its focused tests pass.",
          )

          # Requirement trace: add the new invariant and implementation/regression evidence.
          replace_once(
              "docs/GUI_REQUIREMENT_TRACE.md",
              "| Application | Target-company/application records are separate from employer career history. Only user-selected, externally usable approved experience evidence flows to an application document. Documents inherit that selection without exposing references. | Attaching a document to a non-application or inactive case; silently reusing blocked/review-required confidential evidence. |\n",
              "| Application | Target-company/application records are separate from employer career history. Only user-selected, externally usable approved experience evidence flows to an application document. Documents inherit that selection without exposing references. | Attaching a document to a non-application or inactive case; silently reusing blocked/review-required confidential evidence. |\n"
              "| Human judgment | Consequential application decisions are L3 by server-owned deterministic policy. The human initial view is durable before Agent advice is revealed; Agent advice, human final judgment, and later outcome are separate append-only phases and never career evidence. | Client-selected impact downgrade; Agent phase before human initial; duplicate/out-of-order phases; fabricated Agent recommendation; raw unresolved evidence refs rendered as evidence. |\n",
          )
          replace_once(
              "docs/GUI_REQUIREMENT_TRACE.md",
              "| Application reuse and documents | Application evidence selection, local document save/open, digest mismatch warning, versioned bodies | `gui/test_cases_artifacts.py`, `gui/test_projects.py` | Application empty/active surfaces inspected; latest document controls are additionally protected by DOM and HTTP contracts | Existing artifact kinds/bodies stay readable; new documents use existing digest/version storage and never send externally |\n",
              "| Human-first application judgment | `review_policy.py` owns L0-L3; `judgments.py` owns append-only phases; `gui/judgments.py` owns the browser-safe projection; `applicationJudgment.jsx` is the production L3 caller | `test_judgments.py`, `test_review_policy.py`, `judgment.test.jsx`, `applicationJudgment.test.jsx` | Active application positions show the initial human gate, an honest Agent-pending state, difference/final decision, and optional later outcome; no recommendation is manufactured by the browser or server | Judgment rows remain separate from canonical events/proposals; L0-L2 application/editor flows are unchanged; raw unresolved evidence refs are withheld from the browser |\n"
              "| Application reuse and documents | Application evidence selection, local document save/open, digest mismatch warning, versioned bodies | `gui/test_cases_artifacts.py`, `gui/test_projects.py` | Application empty/active surfaces inspected; latest document controls are additionally protected by DOM and HTTP contracts | Existing artifact kinds/bodies stay readable; new documents use existing digest/version storage and never send externally |\n",
          )

          architecture = Path("docs/ARCHITECTURE_BOUNDARIES.md")
          architecture.write_text(
              architecture.read_text(encoding="utf-8") +
              "\n\n## Human judgment boundary\n\n"
              "`review_policy.py` owns deterministic L0-L3 interaction policy; callers never supply the effective "
              "impact. `judgments.py` owns the append-only decision lifecycle. `gui/judgments.py` adapts that "
              "lifecycle to browser-safe read/write payloads, while `gui/server.py` remains transport only. Raw "
              "unresolved evidence references do not cross the browser boundary. A Host may persist the Agent "
              "assessment with the `judgment assess` CLI command, but Python still never calls an LLM host.\n",
              encoding="utf-8",
          )

          # Release contract for the behavior-changing slice.
          replace_once("pyproject.toml", 'version = "2.20.0"', 'version = "2.21.0"')
          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          heading = "# Changelog\n\n"
          if not text.startswith(heading):
              raise SystemExit("unexpected changelog header")
          release = (
              "## [2.21.0] - 2026-09-02\n\n"
              "- Add a deterministic, host-independent L0-L3 review policy and authenticated judgment API. "
              "Application judgments are always classified L3 by the server, phase writes stay append-only, "
              "the Host can record Agent assessment through the CLI without Python calling an LLM, and the "
              "browser withholds unresolved evidence references rather than presenting syntax as evidence.\n"
              "- Wire Human Judgment into active application records in the production React GUI. The user records "
              "an initial view before Agent advice can appear, sees an honest waiting state when no assessment exists, "
              "compares Human and Agent judgments, records a final decision and optional later outcome, and receives "
              "the same product copy in Korean, Japanese, and English.\n\n"
          )
          changelog.write_text(heading + release + text[len(heading):], encoding="utf-8")
          for name in ("docs/upgrading.md", "docs/upgrading_ko.md", "docs/upgrading_ja.md"):
              replace_once(name, "`2.20.0`", "`2.21.0`")
          PY

      - name: install Python verification dependencies
        run: |
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --require-hashes -r requirements-dev.lock

      - name: synchronize release copies
        run: python scripts/sync_version.py

      - name: frontend test and production bundle
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: focused judgment regressions
        run: |
          python skills/career-agent/test_judgments.py
          python skills/career-agent/test_review_policy.py
          python scripts/check_career_agent_boundaries.py
          python scripts/check_docs_drift.py
          python scripts/check_release_consistency.py

      - name: repository verification matrix
        run: python scripts/run_all_checks.py

      - name: commit synchronized slice
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No synchronization changes to commit"
            exit 0
          fi
          git commit -m "Complete judgment impact workflow slice"
          git push origin HEAD:feat/judgment-impact-workflow
