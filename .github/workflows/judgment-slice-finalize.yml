name: judgment-slice-finalize

on:
  push:
    branches:
      - feat/judgment-impact-workflow

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22.14.0'

      - name: apply staged judgment slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/judgment-slice-sync.yml')
          lines = source.read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          body = []
          for line in lines[start:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          target = Path('/tmp/apply_judgment_slice.py')
          target.write_text('\n'.join(body) + '\n', encoding='utf-8')
          PY
          python /tmp/apply_judgment_slice.py
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/test_career_agent_boundaries.py')
          text = path.read_text(encoding='utf-8')
          old = '''                "gui.cases",\n                "gui.artifacts",\n            },\n'''
          new = '''                "gui.cases",\n                "gui.artifacts",\n                "gui.judgments",\n                "gui.judgment_copy",\n            },\n'''
          if old not in text:
              raise SystemExit('missing GUI module expectation anchor')
          text = text.replace(old, new, 1)
          old_assert = '''        self.assertIn("gui.artifacts", boundaries.APPLICATION_MODULES)\n        self.assertIn("sessions", boundaries.APPLICATION_MODULES)\n'''
          new_assert = '''        self.assertIn("gui.artifacts", boundaries.APPLICATION_MODULES)\n        self.assertIn("gui.judgments", boundaries.APPLICATION_MODULES)\n        self.assertIn("gui.judgment_copy", boundaries.APPLICATION_MODULES)\n        self.assertIn("sessions", boundaries.APPLICATION_MODULES)\n'''
          if old_assert not in text:
              raise SystemExit('missing GUI application expectation anchor')
          path.write_text(text.replace(old_assert, new_assert, 1), encoding='utf-8')
          PY

      - name: install Python verification dependencies
        run: |
          python -m pip install --quiet --require-hashes -r requirements.lock
          python -m pip install --quiet --require-hashes -r requirements-dev.lock

      - name: synchronize release copies
        run: python scripts/sync_version.py

      - name: frontend test and production bundle
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: focused judgment regressions
        run: |
          python skills/career-agent/test_judgments.py
          python skills/career-agent/test_review_policy.py
          python scripts/check_career_agent_boundaries.py
          python scripts/test_career_agent_boundaries.py
          python scripts/check_docs_drift.py
          python scripts/check_release_consistency.py

      - name: create clean local verification commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/judgment-slice-sync.yml .github/workflows/judgment-slice-finalize.yml
          git add -A
          git commit -m "Complete judgment impact workflow slice"
          test -z "$(git status --porcelain)"

      - name: repository verification matrix
        run: python scripts/run_all_checks.py

      - name: publish verified slice
        run: git push origin HEAD:feat/judgment-impact-workflow
