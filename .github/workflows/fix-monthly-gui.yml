name: fix-monthly-gui

on:
  push:
    branches:
      - feat/gui-monthly-career-review

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: feat/gui-monthly-career-review
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Apply final contract fixes
        run: python .github/fix_monthly_gui.py
      - name: Install runtime dependencies
        run: python -m pip install --quiet --require-hashes -r requirements.lock
      - name: Run targeted regressions
        run: |
          python skills/career-agent/gui/test_product_localization.py
          python skills/career-agent/gui/test_projects.py
      - name: Commit fixes
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/fix_monthly_gui.py .github/workflows/fix-monthly-gui.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden monthly Career Review contracts"
          git push origin HEAD:feat/gui-monthly-career-review
