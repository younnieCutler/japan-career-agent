name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified tag and GitHub Release"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run checks and tag validation without pushing a tag or creating a Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: install verification dependencies
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet "ruff>=0.8,<1"
      - name: read release identity and enforce the explicit release gate
        id: release
        shell: bash
        run: |
          set -euo pipefail
          current_version="$(python -c 'import json; print(json.load(open(".claude-plugin/plugin.json", encoding="utf-8"))["version"])')"
          publish="${{ inputs.publish || 'false' }}"
          dry_run="${{ inputs.dry_run || 'false' }}"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$current_version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          if [[ "$publish" != "true" && "$dry_run" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release gate is closed. Select publish or dry_run when dispatching the workflow."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Explicit release gate opened for v$current_version (publish=$publish, dry_run=$dry_run)."
          fi
      - name: verify before creating a tag
        if: steps.release.outputs.changed == 'true'
        run: python scripts/run_all_checks.py
      - name: create or verify immutable tag
        if: steps.release.outputs.changed == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            python scripts/check_release_tag.py --tag "$TAG" --sha "$GITHUB_SHA"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: tag $TAG is absent and would be created at $GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" "$GITHUB_SHA" --message "Release $TAG"
            git push origin "$TAG"
            python scripts/check_release_tag.py --tag "$TAG" --sha "$GITHUB_SHA"
          fi
      - name: create GitHub Release
        if: steps.release.outputs.changed == 'true' && steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
