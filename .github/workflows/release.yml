name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the verified tag and GitHub Release"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run checks and tag validation without pushing a tag or creating a Release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  # PyPI Trusted Publishing and npm provenance both exchange this short-lived OIDC token for
  # upload rights, so no long-lived registry credential has to live in this repository.
  id-token: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"
      - name: install verification dependencies
        run: |
          python -m pip install --quiet --require-hashes -r requirements-dev.lock
      - name: read release identity and enforce the explicit release gate
        id: release
        shell: bash
        run: |
          set -euo pipefail
          # pyproject.toml is the single source of truth; the manifests are generated copies.
          current_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          publish="${{ inputs.publish || 'false' }}"
          dry_run="${{ inputs.dry_run || 'false' }}"
          echo "version=$current_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$current_version" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry_run" >> "$GITHUB_OUTPUT"
          if [[ "$publish" == "true" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Publishing is allowed only from main."
              exit 1
            fi
            git fetch origin main --force
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]]; then
              echo "HEAD must equal origin/main before publishing."
              exit 1
            fi
          fi
          if [[ "$publish" != "true" && "$dry_run" != "true" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release gate is closed. Select publish or dry_run when dispatching the workflow."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Explicit release gate opened for v$current_version (publish=$publish, dry_run=$dry_run)."
          fi
      - name: verify before creating a tag
        if: steps.release.outputs.changed == 'true'
        run: python scripts/run_all_checks.py
      - name: build release bundle
        if: steps.release.outputs.changed == 'true'
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: python scripts/build_release.py --output-dir release --expected-commit "$EXPECTED_COMMIT"
      - name: verify release bundle
        if: steps.release.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(python -c 'import json; print(json.load(open("release/release-manifest.json", encoding="utf-8"))["artifact"]["name"])')"
          python scripts/verify_release.py \
            --manifest release/release-manifest.json \
            --checksums release/SHA256SUMS \
            --artifact "release/$artifact" \
            --sbom release/sbom.cdx.json
      - name: smoke-test unpacked release bundle
        if: steps.release.outputs.changed == 'true'
        run: python scripts/test_release_install.py --bundle release
      - name: upload verified release bundle
        if: steps.release.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: japan-career-agent-${{ steps.release.outputs.version }}
          path: release/
          if-no-files-found: error
      - name: create or verify immutable tag
        if: steps.release.outputs.changed == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag }}
          GITHUB_SHA: ${{ github.sha }}
          DRY_RUN: ${{ steps.release.outputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            python scripts/check_release_tag.py --tag "$TAG" --sha "$GITHUB_SHA"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "Dry run: tag $TAG is absent and would be created at $GITHUB_SHA"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag --annotate "$TAG" "$GITHUB_SHA" --message "Release $TAG"
            git push origin "$TAG"
            python scripts/check_release_tag.py --tag "$TAG" --sha "$GITHUB_SHA"
          fi
          if [[ "$DRY_RUN" != "true" ]]; then
            python scripts/check_release_consistency.py --require-tag
          fi
      - name: create GitHub Release
        if: steps.release.outputs.changed == 'true' && steps.release.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
          gh release upload "$TAG" release/* --clobber

      # Publishing happens only after the bundle has been verified and the immutable tag exists,
      # because neither registry allows a version to be replaced. The wheel uploaded here is the
      # same file recorded in release-manifest.json and SHA256SUMS above, so what PyPI serves can
      # be checked against the GitHub Release.
      - name: stage the verified wheel for PyPI
        if: steps.release.outputs.changed == 'true' && steps.release.outputs.dry_run != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          wheel="$(python -c 'import json; print(json.load(open("release/release-manifest.json", encoding="utf-8"))["wheel"]["name"])')"
          cp "release/$wheel" "dist/$wheel"
      - name: publish to PyPI
        if: steps.release.outputs.changed == 'true' && steps.release.outputs.dry_run != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Re-running a release must not fail on an already-published version; the identity of
          # that version was fixed by the immutable tag, not by this step.
          skip-existing: true

      - name: set up node for the npm channel
        if: steps.release.outputs.changed == 'true' && steps.release.outputs.dry_run != 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: publish the npm bootstrapper
        if: steps.release.outputs.changed == 'true' && steps.release.outputs.dry_run != 'true'
        working-directory: packaging/npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "NPM_TOKEN is not configured; skipping the npm channel."
            echo "The PyPI release above is unaffected — uvx and pipx already have this version."
            exit 0
          fi
          version="${{ steps.release.outputs.version }}"
          if npm view "japan-career-agent@$version" version >/dev/null 2>&1; then
            echo "japan-career-agent@$version is already on npm"
          else
            # --provenance attests that this tarball came from this workflow run on this commit.
            npm publish --provenance --access public
          fi
