# Single source for the KO/JA/EN keyword lexicon career_agent.py uses to route a message.
# infer_track(), stage_for() and flow_phase_for() all read this file instead of keeping their
# own copies — the 退職/入社 bug (present in stage_alias but missing from an earlier flow_phase
# copy, and vice versa) was exactly this kind of drift across duplicated keyword lists.

track:
  # "卒" alone is deliberately absent: infer_track() is substring matching, so it would classify
  # 既卒 and 第二新卒 as shinsotsu. The "27卒" case is handled by routing.py's bounded
  # graduation_signal() regex instead.
  shinsotsu: ["新卒", "신졸", "학チカ", "학チ카", "学チカ", "졸업", "graduat", "new grad", "spi3", "学生", "就活", "취활"]
  chuto: ["中途", "중途", "転職", "이직", "직장", "職務経歴書", "career change", "mid-career"]

# First matching entry selects one reference for a chuto message. Keep phrases specific:
# generic interview, research, and document requests continue to use the stage fallback below.
message_context:
  - id: market_salary
    skill: tenshoku-strategy
    reference: references/market-positioning-2025-2026.md
    terms: ["市場年収", "相場", "market salary", "salary benchmark", "market rate", "시장 연봉", "시세"]
  - id: written_conditions
    skill: tenshoku-strategy
    reference: references/roudou-joken-review.md
    terms: ["労働条件通知書", "書面の労働条件", "書面のオファー", "書面オファー", "書面と口頭の条件", "written offer", "written conditions", "offer contradiction", "근로조건통지서", "서면 오퍼"]
  - id: interview_followup
    skill: tenshoku-strategy
    reference: references/mensetsu-follow.md
    terms: ["お礼", "interview follow-up", "thank-you email", "면접 감사"]
  - id: resignation_reason
    skill: tenshoku-strategy
    reference: references/taishoku-riyu-reframing.md
    terms: ["退職理由", "転職理由", "reason for leaving", "reason for resignation", "퇴직 사유", "이직 사유"]
  - id: salary_negotiation
    skill: tenshoku-strategy
    reference: references/nenshu-koushou.md
    terms: ["年収交渉", "給与交渉", "salary negotiation", "negotiate salary", "연봉 협상"]
  - id: interview_manner
    skill: tenshoku-strategy
    reference: references/mensetsu-manner.md
    terms: ["面接マナー", "面接の入室", "面接の服装", "interview etiquette", "interview attire", "면접 매너"]
  - id: graceful_resignation
    skill: tenshoku-strategy
    reference: references/enman-taishoku.md
    terms: ["円満退職", "予告期間", "退職届", "退職の引き継ぎ", "notice period", "handover plan", "퇴사 통보 기간", "인수인계"]
  - id: onboarding
    skill: tenshoku-strategy
    reference: references/nyusha-teichaku.md
    terms: ["入社手続き", "入社書類", "入社準備", "onboarding paperwork", "joining procedures", "입사 절차"]
  - id: offer_handling
    skill: tenshoku-strategy
    reference: references/naitei-taiou.md
    terms: ["オファー面談", "内定への回答", "内定回答", "内定の回答期限", "内定辞退", "offer deadline", "offer response", "오퍼 답변", "내정 답변"]
  - id: application_tracking
    skill: tenshoku-strategy
    reference: references/senko-tracking.md
    terms: ["選考状況", "応募状況", "選考管理", "application tracking", "application status", "지원 현황", "전형 현황"]

# Order matters: stage_for() returns on the first alias whose terms match, so earlier groups
# outrank later ones when a message contains keywords from more than one group.
stage_alias:
  - alias: self
    terms: ["자기분석", "自己分析", "self-analysis", "career direction", "work style", "values"]
  - alias: documents
    terms: ["자소서", "가쿠치카", "학チ카", "학チカ", "学チカ", "자기pr", "自己pr", "이력서", "履歴書", "職務経歴書", "resume", "cv", "cover letter", "personal statement", "entry sheet", "es"]
  - alias: research
    terms: ["企業研究", "기업 연구", "company research", "research companies", "company study", "job research"]
  - alias: interview
    terms: ["면접", "面接", "interview"]
  - alias: offer
    terms: ["내정", "内定", "job offer", "offer meeting"]
  - alias: exit
    terms: ["퇴직", "입사", "退職", "入社", "resign", "joining", "onboarding", "start date"]
  # Applying and reviewing a posting are different intents. "応募/지원" is the application workflow
  # (chuto 応募・書類選考 → matching-simulator); a bare 求人/JD is an evidence review of that posting
  # against the user's own history (chuto 職務経歴書・自己PR → job-seeker-agent). apply sits after
  # every other specific-task group (documents, research, interview, offer, exit): a message naming
  # one of those alongside "応募" means that more specific task, not a bare application. It still
  # comes before the bare-JD documents group below, so "この求人に応募できるか" resolves as an
  # application rather than a document review.
  - alias: apply
    terms: ["応募", "응모", "지원", "apply for", "apply to", "application"]
  - alias: documents
    terms: ["求人", "공고", "구인", "jd", "job description", "job posting", "job ad"]
  - alias: chuto
    terms: ["転職", "중途", "career change", "mid-career"]
  - alias: shinsotsu
    terms: ["신졸", "新卒", "new graduate", "graduating soon"]
  # Last on purpose: "I don't know how to prepare for the interview" must stay an interview
  # request. Only a message with no more specific signal falls through to direction work.
  - alias: self
    terms: ["모르겠", "分からない", "わからない", "何がしたい", "何をしたい", "not sure what", "don't know what", "no idea what"]

# Career readiness and job-search intent are separate concepts, so they get their own tables.
# These are read by maintenance_intent(), opportunity_review_intent() and active_search_intent()
# and never by stage_for() or skill_context(), so the four tables around them keep their exact
# behaviour.
#
# Every entry is a phrase, never a fragment. A bare 経歴 / 記録 / 성과 / 기록 / 이직 would fire
# inside 職務経歴書, 경력기술서 and half the chuto lexicon — the same substring over-match the
# header of this file already warns about for 卒.

# Going back over experience that happened before the system ever saw it: キャリアの棚卸し. This is
# historical backfill, not upkeep, and it is checked before `maintenance` because every phrase here
# carries a scope marker the maintenance vocabulary does not -- 지금까지, これまで, so far, everything.
# "오늘 한 일 기록해줘" has no such marker and must keep routing to maintenance.
#
# Whole phrases only, and the scope marker is what makes them safe. A bare 정리 / 整理 / 経歴 would
# fire inside half the maintenance table and inside 職務経歴書, which is already
# `stage_alias.documents`.
tanaoroshi:
  - "지금까지의 경력을 정리"
  - "지금까지 경력을 정리"
  - "지금까지의 경험을 정리"
  - "지금까지 경험을 정리"
  - "지금까지 해온 일을 정리"
  - "그동안의 경력을 정리"
  - "그동안 해온 일을 정리"
  - "경력 전체를 정리"
  - "경력 전체를 돌아"
  - "예전 회사 경험까지"
  - "이전 회사 경험까지"
  - "학창시절 경험을 정리"
  - "대학 때 경험을 정리"
  - "커리어 전체를 정리"
  - "キャリアの棚卸"
  - "経歴の棚卸"
  - "棚卸しをしたい"
  - "棚卸しから始め"
  - "これまでの経験を整理"
  - "これまでの経歴を整理"
  - "これまでのキャリアを整理"
  - "学生時代の経験を整理"
  - "過去の経験をまとめ"
  - "career inventory"
  - "inventory my experience"
  - "inventory my career"
  - "take stock of my career"
  - "go through my past experience"
  - "everything i have done so far"
  - "start from my past experience"

# Recording what happened at the job the user already has. This says nothing about wanting to
# leave, and reaching it must never be read as intent to leave.
maintenance:
  - "업무일지"
  - "오늘 한 일"
  - "오늘 일한"
  - "업무 기록"
  - "업무를 기록"
  - "커리어 기록"
  - "경력 기록"
  - "경력으로 남"
  - "경력으로 쓸"
  - "경력은 정리"
  - "경력만 정리"
  - "경력을 정리"
  - "성과 정리"
  - "성과를 정리"
  - "業務記録"
  - "業務日誌"
  - "仕事を記録"
  - "今日やった仕事"
  - "経歴として残"
  - "経歴は更新"
  - "今期の成果"
  - "成果を整理"
  - "work log"
  - "log my work"
  - "career evidence"
  - "keep my work history"
  - "record what i did"
  - "save this project as career"

# Looking at one opportunity without starting a search. Reviewing it, however many times, is not
# evidence of intent — only an explicit `set-job-search on` is.
opportunity_review:
  - "헤드헌터"
  - "헤드헌팅"
  - "스카우트 제안"
  - "제안이 왔는데"
  - "괜찮은 포지션인지"
  - "괜찮은 자리인지"
  - "ヘッドハンター"
  - "スカウト"
  - "見てほしいだけ"
  - "recruiter reached out"
  - "recruiter sent"
  - "just review this"
  - "is this a good position"

# Closing an opportunity out and returning to plain career upkeep. `maintenance` is the resting
# state, so it needs a way back: without this a single recruiter message left the mode at
# `opportunity_review` indefinitely, since work events deliberately do not move it.
# Deliberately not in the `maintenance` table above — that one triggers work-event capture, and
# "이번 건은 안 할래" is a decision about an opportunity, not something to record as work.
review_closed:
  - "이번 건은 안"
  - "이 회사는 안"
  - "지원 안 하기로"
  - "이직 안 하기로"
  - "이직은 안 하기로"
  - "검토 끝"
  - "검토는 끝"
  - "관심 없어졌"
  - "평소 경력관리로"
  - "경력관리로 돌아"
  - "今回は見送"
  - "見送ります"
  - "応募しないことに"
  - "転職はしないことに"
  - "検討は終わ"
  - "not pursuing this"
  - "passing on this"
  - "decided not to apply"
  - "done reviewing"

# A move that is already decided and is being carried out. Phrases only, and specific ones:
# 退職理由 is an interview question about a past move and must not fire here, which is why the
# bare stems 退職 / 入社 / 퇴직 are absent. Unlike active_search this does not depend on the
# job-search flag — someone resigning has decided regardless of whether they were ever "looking".
transition:
  - "퇴사 통보"
  - "퇴직서"
  - "사직서"
  - "인수인계"
  - "입사 절차"
  - "입사 준비"
  - "退職届"
  - "円満退職"
  - "退職の引き継ぎ"
  - "入社手続き"
  - "入社書類"
  - "resignation letter"
  - "notice period"
  - "handover plan"
  - "onboarding paperwork"

# Declaring an active search. The runtime only ever reads this back as a suggested
# `set-job-search on`; nothing here writes the flag.
active_search:
  # Checked first and vetoes the terms below. "이직 준비 시작할 생각은 없어" contains the whole
  # active-search phrase and means its opposite.
  negation:
    - "건 아니"
    - "건 아냐"
    - "건 아님"
    - "은 아니"
    - "는 아니"
    # Korean negates intent at the end of the sentence, and an adverb slots in freely between the
    # noun and the negation ("생각은 아직 없어요"). Matching the closing form covers the whole
    # family without one entry per adverb. Over-vetoing is the safe direction: the worst outcome
    # is that the user runs `set-job-search on` themselves, which they must do anyway.
    - "없어"
    - "없습니다"
    - "없다"
    - "없는데"
    - "없지만"
    - "없음"
    - "予定はない"
    - "予定は無い"
    - "つもりはない"
    - "つもりは無い"
    - "わけではない"
    - "ではありません"
    - "ないです"
    - "not starting"
    - "not looking"
    - "no plans to"
    - "am not job"
  terms:
    - "이직 준비 시작"
    - "이직 준비를 시작"
    - "본격적으로 이직"
    - "진짜 이직 준비"
    - "지원해보고 싶"
    - "지원하고 싶"
    - "면접까지 가볼"
    - "転職活動を始め"
    - "本気で転職"
    - "応募したい"
    - "start job hunting"
    - "start my job search"
    - "start looking for a job"
    - "i want to apply"
    - "ready to apply"

# Order matters here too: flow_phase_for() returns on the first phase whose terms match.
flow_phase:
  shinsotsu:
    - id: summer_entry
      terms: ["여름", "summer", "夏", "インターン"]
    - id: autumn_winter_early
      terms: ["가을", "겨울", "autumn", "winter", "秋", "冬", "早期選考"]
    - id: official_selection
      terms: ["본선", "공식", "official", "本選考"]
    - id: offer_onboarding
      terms: ["내정", "입사", "内々定", "内定", "入社"]
  chuto:
    - id: documents
      terms: ["職務経歴書", "경력기술서", "이력서", "resume", "cv", "career history", "work history"]
    - id: application
      terms: ["지원", "応募", "서류", "書類", "apply", "application", "applied", "screening", "documents"]
    - id: interview
      terms: ["면접", "面接", "interview"]
    - id: offer
      terms: ["오퍼", "연봉", "内定", "オファー", "条件", "offer", "salary", "compensation", "conditions"]
    - id: exit_onboarding
      terms: ["퇴직", "입사", "退職", "入社", "resign", "joining", "onboarding", "start date"]
