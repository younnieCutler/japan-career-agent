[metadata]
title = "Japan career flow reference"
reviewed_on = "2026-08-01"
review_due = "2027-03-01"
maintainer = "manual review only"
sources = [
  "https://www.cas.go.jp/jp/seisaku/shushoku_katsudou_yousei/2027nendosotu/index.html",
