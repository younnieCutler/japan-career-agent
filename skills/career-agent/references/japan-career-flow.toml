]

[shinsotsu]
scope = "University and graduate-school job hunting only"

[[shinsotsu.phases]]
id = "preparation"
label = "自己分析・素材準備"
purpose = "Fix the job-hunting axis and prepare multiple evidence-backed stories."

[[shinsotsu.phases]]
id = "summer_entry"
label = "夏インターン応募"
purpose = "Prepare company research, ES, and aptitude-test practice for internship entry."

[[shinsotsu.phases]]
id = "summer_reflection"
label = "夏インターン振り返り"
purpose = "Record questions, feedback, and next changes while evidence is fresh."

[[shinsotsu.phases]]
id = "autumn_winter_early"
label = "秋冬・早期選考"
purpose = "Tailor documents and interview preparation without changing the personal axis."

[[shinsotsu.phases]]
id = "official_selection"
label = "本選考"
purpose = "Use the current academic-year official schedule; do not hard-code dates here."

[[shinsotsu.phases]]
id = "offer_onboarding"
label = "内々定・入社準備"
purpose = "Confirm conditions and prepare for entry without automatic external action."

[chuto]
scope = "Japanese mid-career job change"

[[chuto.phases]]
id = "preparation"
label = "自己分析・転職軸"
purpose = "Recover relevant evidence, define the target direction, and keep factual transition reasons separate from hypotheses."

[[chuto.phases]]
id = "base_documents"
label = "応募基盤・職務経歴書"
purpose = "Prepare a reusable evidence-backed candidate profile and base documents before tailoring to one employer."

[[chuto.phases]]
id = "opportunity_discovery"
label = "求人探索・候補整理"
purpose = "Discover current public opportunities, preserve provenance, and let the user choose which postings enter deeper review."

[[chuto.phases]]
id = "opportunity_analysis"
label = "企業研究・JD分析"
purpose = "Research the company and posting, then diagnose requirements against confirmed candidate evidence without a fit score."

[[chuto.phases]]
id = "application_selection"
label = "応募・書類選考"
purpose = "Tailor the application package, record the application when the user starts it, and keep selection tracking active through closure."

[[chuto.phases]]
id = "interview"
label = "面接・選考"
purpose = "Prepare evidence-backed answers, practise against the actual interview context when known, and record feedback or unknown reasons after each outcome."

[[chuto.phases]]
id = "offer"
label = "内定・条件交渉"
purpose = "Review written conditions, deadlines, compensation, role scope, and trade-offs before the user accepts or declines."

[[chuto.phases]]
id = "exit"
label = "退職・引き継ぎ"
purpose = "Plan resignation, handover, and applicable transition administration only after the user decides to proceed."

[[chuto.phases]]
id = "onboarding"
label = "入社準備・オンボーディング"
purpose = "Verify joining documents, applicable authorization/tax/insurance handoffs, and the first 90 days without inventing employer requirements."
