[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "japan-career-agent"
version = "2.22.0"
description = "Local-first evidence-based career decision support for Japan job seekers: confirmed facts, conflicts, unknowns, verification, and user-controlled next actions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "younnieCutler" }]
keywords = ["japan", "job-search", "recruitment", "career", "matching", "tenshoku", "self-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Japanese",
  "Natural Language :: Korean",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/younnieCutler/japan-career-agent"
Repository = "https://github.com/younnieCutler/japan-career-agent"
Documentation = "https://github.com/younnieCutler/japan-career-agent/blob/main/docs/README.md"
Changelog = "https://github.com/younnieCutler/japan-career-agent/blob/main/CHANGELOG.md"

# Both names run the same launcher. `uvx <package>` looks for a script matching the package name,
# so dropping `japan-career-agent` would break the documented one-line install; `career-agent` is
# the short name to type once the tool is on PATH.
[project.scripts]
japan-career-agent = "japan_career_agent.cli:main"
career-agent = "japan_career_agent.cli:main"

# The runtime is shipped as data, not as an importable package: `_shared/` and
# `skills/career-agent/` hold no `__init__.py` and use flat imports. Both trees are relocated
# under the launcher package while keeping their relative positions, which is what makes
# `runtime.py`'s `parent.parent.parent / "_shared"` resolve inside the wheel — so no runtime
# module needs a packaging-specific change.
#
# `sources` rather than `force-include`: force-included paths bypass file selection entirely, so
# `exclude` below would be silently ignored and every `test_*.py` would ship.
[tool.hatch.build.targets.wheel]
# Skill-First Gate C: every domain Skill ships, not just the two the CLI directly drives. A
# `skill-open` for a Skill absent from the wheel would have nothing to point a host at, and
# `skills` would list Skills a standalone install can never actually discover. `exclude` below
# drops each one's tests; SKILL.md and references travel as the prompt a host handoff refers to.
only-include = [
  "packaging/japan_career_agent",
  "_shared",
  "skills/career-agent",
  "skills/career-document",
  "skills/career-maintenance",
  "skills/career-tanaoroshi",
  "skills/company-battlecard",
  "skills/trim",
  "skills/factcheck",
  "skills/challenge",
  "skills/hiring-manager-agent",
  "skills/humanize-japanese-career",
  "skills/jiko-bunseki",
  "skills/job-seeker-agent",
  "skills/kigyou-bunseki",
  "skills/matching-simulator",
  "skills/mock-interviewer",
  "skills/intent",
  "skills/verify",
  "skills/tenshoku-strategy",
]

# The runtime's tests live beside the modules they exercise. They are part of the repository
# contract, not of what an installed user runs; `scripts/test_pyproject_install.py` asserts they
# stay out.
# `*.code-workspace` is an editor artifact in every skill directory it appears in.
# `skills/kigyou-bunseki/scripts/extract_url.sh` is a repo-only dev convenience: SKILL.md never
# references it, so a host executing the SOP has no reason to call it, and it should not ship.
exclude = [
  "test_*.py", "tests", "__pycache__", "*.code-workspace",
  "skills/kigyou-bunseki/scripts/extract_url.sh",
]

[tool.hatch.build.targets.wheel.sources]
"packaging" = ""
"_shared" = "japan_career_agent/_shared"
"skills/career-agent" = "japan_career_agent/skills/career-agent"
"skills/career-document" = "japan_career_agent/skills/career-document"
"skills/career-maintenance" = "japan_career_agent/skills/career-maintenance"
"skills/career-tanaoroshi" = "japan_career_agent/skills/career-tanaoroshi"
"skills/company-battlecard" = "japan_career_agent/skills/company-battlecard"
"skills/trim" = "japan_career_agent/skills/trim"
"skills/factcheck" = "japan_career_agent/skills/factcheck"
"skills/challenge" = "japan_career_agent/skills/challenge"
"skills/hiring-manager-agent" = "japan_career_agent/skills/hiring-manager-agent"
"skills/humanize-japanese-career" = "japan_career_agent/skills/humanize-japanese-career"
"skills/jiko-bunseki" = "japan_career_agent/skills/jiko-bunseki"
"skills/job-seeker-agent" = "japan_career_agent/skills/job-seeker-agent"
"skills/kigyou-bunseki" = "japan_career_agent/skills/kigyou-bunseki"
"skills/matching-simulator" = "japan_career_agent/skills/matching-simulator"
"skills/mock-interviewer" = "japan_career_agent/skills/mock-interviewer"
"skills/intent" = "japan_career_agent/skills/intent"
"skills/verify" = "japan_career_agent/skills/verify"
"skills/tenshoku-strategy" = "japan_career_agent/skills/tenshoku-strategy"

[tool.hatch.build.targets.sdist]
include = [
  "/packaging/japan_career_agent",
  "/_shared",
  "/skills/career-agent",
  "/skills/career-document",
  "/skills/career-maintenance",
  "/skills/career-tanaoroshi",
  "/skills/company-battlecard",
  "/skills/trim",
  "/skills/factcheck",
  "/skills/challenge",
  "/skills/hiring-manager-agent",
  "/skills/humanize-japanese-career",
  "/skills/jiko-bunseki",
  "/skills/job-seeker-agent",
  "/skills/kigyou-bunseki",
  "/skills/matching-simulator",
  "/skills/mock-interviewer",
  "/skills/intent",
  "/skills/verify",
  "/skills/tenshoku-strategy",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
