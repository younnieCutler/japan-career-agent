[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "japan-career-agent"
version = "3.0.0"
description = "Local-first evidence-based career decision support for Japan job seekers: confirmed facts, conflicts, unknowns, verification, and user-controlled next actions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "younnieCutler" }]
keywords = ["japan", "job-search", "recruitment", "career", "matching", "tenshoku", "self-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Japanese",
  "Natural Language :: Korean",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/younnieCutler/japan-career-agent"
Repository = "https://github.com/younnieCutler/japan-career-agent"
Documentation = "https://github.com/younnieCutler/japan-career-agent/blob/main/docs/README.md"
Changelog = "https://github.com/younnieCutler/japan-career-agent/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
only-include = [
  "_shared",
  "scripts",
  "skills/career-document",
  "skills/career-tanaoroshi",
  "skills/company-battlecard",
  "skills/trim",
  "skills/factcheck",
  "skills/challenge",
  "skills/hiring-manager-agent",
  "skills/humanize-japanese-career",
  "skills/jiko-bunseki",
  "skills/job-seeker-agent",
  "skills/kigyou-bunseki",
  "skills/matching-simulator",
  "skills/mock-interviewer",
  "skills/intent",
  "skills/verify",
  "skills/tenshoku-strategy",
]

exclude = [
  "test_*.py", "tests", "__pycache__", "*.code-workspace",
  "skills/kigyou-bunseki/scripts/extract_url.sh",
]

[tool.hatch.build.targets.sdist]
include = [
  "/_shared",
  "/scripts",
  "/skills/career-document",
  "/skills/career-tanaoroshi",
  "/skills/company-battlecard",
  "/skills/trim",
  "/skills/factcheck",
  "/skills/challenge",
  "/skills/hiring-manager-agent",
  "/skills/humanize-japanese-career",
  "/skills/jiko-bunseki",
  "/skills/job-seeker-agent",
  "/skills/kigyou-bunseki",
  "/skills/matching-simulator",
  "/skills/mock-interviewer",
  "/skills/intent",
  "/skills/verify",
  "/skills/tenshoku-strategy",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
