[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "japan-career-agent"
version = "2.5.1"
description = "Local-first evidence-based career decision support for Japan job seekers: confirmed facts, conflicts, unknowns, verification, and user-controlled next actions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "younnieCutler" }]
keywords = ["japan", "job-search", "recruitment", "career", "matching", "tenshoku", "self-analysis"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: Japanese",
  "Natural Language :: Korean",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
]
dependencies = [
  "PyYAML>=6,<7",
  "jsonschema>=4.23,<5",
]

[project.urls]
Homepage = "https://github.com/younnieCutler/japan-career-agent"
Repository = "https://github.com/younnieCutler/japan-career-agent"
Changelog = "https://github.com/younnieCutler/japan-career-agent/blob/main/CHANGELOG.md"

# Both names run the same launcher. `uvx <package>` looks for a script matching the package name,
# so dropping `japan-career-agent` would break the documented one-line install; `career-agent` is
# the short name to type once the tool is on PATH.
[project.scripts]
japan-career-agent = "japan_career_agent.cli:main"
career-agent = "japan_career_agent.cli:main"

# The runtime is shipped as data, not as an importable package: `_shared/` and
# `skills/career-agent/` hold no `__init__.py` and use flat imports. Both trees are relocated
# under the launcher package while keeping their relative positions, which is what makes
# `runtime.py`'s `parent.parent.parent / "_shared"` resolve inside the wheel — so no runtime
# module needs a packaging-specific change.
#
# `sources` rather than `force-include`: force-included paths bypass file selection entirely, so
# `exclude` below would be silently ignored and every `test_*.py` would ship.
[tool.hatch.build.targets.wheel]
only-include = ["packaging/japan_career_agent", "_shared", "skills/career-agent"]

# The runtime's tests live beside the modules they exercise. They are part of the repository
# contract, not of what an installed user runs; `scripts/test_pyproject_install.py` asserts they
# stay out.
exclude = ["test_*.py", "tests", "__pycache__"]

[tool.hatch.build.targets.wheel.sources]
"packaging" = ""
"_shared" = "japan_career_agent/_shared"
"skills/career-agent" = "japan_career_agent/skills/career-agent"

[tool.hatch.build.targets.sdist]
include = [
  "/packaging/japan_career_agent",
  "/_shared",
  "/skills/career-agent",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
]
